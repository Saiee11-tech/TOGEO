<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToGeo</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#111827;
}

button{
    border:none;
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* ================= LOGIN ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:22px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    color:#1769ff;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin:8px 0 25px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
    margin-bottom:12px;
    outline:none;
}

input:focus{
    border-color:#1769ff;
}

.primaryBtn{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#1769ff;
    color:white;
    font-size:16px;
    margin-top:5px;
}

.secondaryBtn{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#eaf1ff;
    color:#1769ff;
    font-size:16px;
    margin-top:10px;
}

#message{
    text-align:center;
    min-height:22px;
    margin-top:15px;
}

/* ================= APP ================= */

#mainApp{
    min-height:100vh;
}

.topbar{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:10;
}

.topLogo{
    font-size:25px;
    font-weight:bold;
    color:#1769ff;
}

.logoutBtn{
    background:#ff3b30;
    color:white;
    padding:10px 17px;
    border-radius:10px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* ================= NAV ================= */

.nav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    background:white;
    padding:8px;
    border-radius:15px;
    margin-bottom:20px;
}

.nav button{
    padding:12px 5px;
    background:white;
    border-radius:10px;
    font-size:14px;
}

.nav button.active{
    background:#1769ff;
    color:white;
}

/* ================= SECTIONS ================= */

.section{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.section h2{
    margin-top:0;
}

/* ================= SEARCH ================= */

.searchRow{
    display:flex;
    gap:10px;
}

.searchRow input{
    margin:0;
    flex:1;
}

.searchBtn{
    padding:0 20px;
    border-radius:12px;
    background:#1769ff;
    color:white;
    font-size:15px;
}

.result{
    margin-top:15px;
    padding:15px;
    border:1px solid #e5e7eb;
    border-radius:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.userInfo{
    min-width:0;
}

.userName{
    font-weight:bold;
    font-size:16px;
}

.userEmail{
    color:#6b7280;
    font-size:13px;
    word-break:break-all;
}

.smallBtn{
    background:#1769ff;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    white-space:nowrap;
}

.acceptBtn{
    background:#16a34a;
}

.rejectBtn{
    background:#ef4444;
}

/* ================= LIST ================= */

.listItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 5px;
    border-bottom:1px solid #e5e7eb;
}

.listItem:last-child{
    border-bottom:none;
}

.empty{
    text-align:center;
    color:#6b7280;
    padding:30px 10px;
}

/* ================= CHAT LIST ================= */

.chatItem{
    padding:15px;
    border-bottom:1px solid #e5e7eb;
    cursor:pointer;
}

.chatItem:hover{
    background:#f8fafc;
}

.chatName{
    font-weight:bold;
}

.lastMessage{
    color:#6b7280;
    font-size:14px;
    margin-top:5px;
}

/* ================= CHAT WINDOW ================= */

#chatWindow{
    position:fixed;
    inset:0;
    background:#f1f5f9;
    z-index:100;
    display:none;
    flex-direction:column;
}

.chatHeader{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.backBtn{
    background:#eef2ff;
    color:#1769ff;
    padding:9px 13px;
    border-radius:10px;
}

.chatTitle{
    font-weight:bold;
}

.chatMessages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.bubble{
    max-width:75%;
    padding:11px 14px;
    border-radius:15px;
    word-wrap:break-word;
}

.mine{
    align-self:flex-end;
    background:#1769ff;
    color:white;
    border-bottom-right-radius:4px;
}

.theirs{
    align-self:flex-start;
    background:white;
    border-bottom-left-radius:4px;
}

.chatInputArea{
    background:white;
    padding:10px;
    display:flex;
    gap:8px;
}

.chatInputArea input{
    margin:0;
    flex:1;
}

.sendBtn{
    width:70px;
    border-radius:12px;
    background:#1769ff;
    color:white;
}

/* ================= HOME ================= */

.home{
    text-align:center;
    padding:30px 10px;
}

.home h1{
    margin-bottom:5px;
}

.home p{
    color:#6b7280;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:25px;
}

.stat{
    padding:25px;
    background:#f8fafc;
    border-radius:15px;
}

.statNumber{
    font-size:28px;
    font-weight:bold;
    color:#1769ff;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .nav button{
        font-size:12px;
    }

    .result{
        align-items:flex-start;
    }

    .searchRow{
        flex-direction:column;
    }

    .searchBtn{
        height:48px;
    }

    .bubble{
        max-width:85%;
    }
}
</style>
</head>

</div>


<!-- =====================================================

<div id="chatWindow">

/* =====================================================

function showMessage(text, success = false){

    message.textContent = text;

    message.style.color =
        success ? "green" : "red";
}


/* =====================================================
                    NAVIGATION
====================================================== */

const sections = {

    home:
        document.getElementById("homeSection"),

    chats:
        document.getElementById("chatsSection"),

    friends:
        document.getElementById("friendsSection"),

    requests:
        document.getElementById("requestsSection")
};


function showSection(name){

    Object.values(sections).forEach(section => {

        section.classList.add("hidden");

    });

    sections[name].classList.remove("hidden");


    document.querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));


    if(name === "home")
        document.getElementById("navHome").classList.add("active");

    if(name === "chats")
        document.getElementById("navChats").classList.add("active");

    if(name === "friends")
        document.getElementById("navFriends").classList.add("active");

    if(name === "requests")
        document.getElementById("navRequests").classList.add("active");
}


document.getElementById("navHome")
    .onclick = () => showSection("home");


document.getElementById("navChats")
    .onclick = () => {

        showSection("chats");

        loadChats();

    };


document.getElementById("navFriends")
    .onclick = () => {

        showSection("friends");

        loadFriends();

    };


document.getElementById("navRequests")
    .onclick = () => {

        showSection("requests");

        loadRequests();

    };


/* =====================================================
                    CREATE ACCOUNT
====================================================== */

signupBtn.onclick = async () => {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        showMessage(
            "Enter email and password."
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters."
        );

        return;
    }


    try{

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        /* Create profile */

        try{

            await setDoc(
                doc(db,"users",result.user.uid),
                {
                    uid:result.user.uid,
                    email:email,
                    name:email.split("@")[0],
                    createdAt:serverTimestamp()
                }
            );

        }catch(profileError){

            console.error(
                "Profile creation error:",
                profileError
            );

        }


        showMessage(
            "Account created successfully!",
            true
        );


    }catch(error){

        console.error(error);

        showMessage(
            error.code + " : " + error.message
        );

    }

};


/* =====================================================
                        LOGIN
====================================================== */

loginBtn.onclick = async () => {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        showMessage(
            "Enter email and password."
        );

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        showMessage(
            "Login successful!",
            true
        );


    }catch(error){

        console.error(error);

        showMessage(
            error.code + " : " + error.message
        );

    }

};


/* =====================================================
                    AUTH STATE
====================================================== */

onAuthStateChanged(auth, async (user) => {

    if(user){

        currentUser = user;


        /*
         IMPORTANT:
         App opens immediately after authentication.
         Firestore errors will NOT block app.
        */

        loginPage.style.display = "none";

        mainApp.classList.remove("hidden");


        document.getElementById("welcomeText")
            .textContent =
            "Logged in as: " + user.email;


        showSection("home");


        /* Load data separately */

        loadFriends();

        loadRequests();

        loadChats();


        /* Create missing profile */

        try{

            const userRef =
                doc(db,"users",user.uid);

            const snap =
                await getDoc(userRef);


            if(!snap.exists()){

                await setDoc(
                    userRef,
                    {
                        uid:user.uid,
                        email:user.email,
                        name:user.email.split("@")[0],
                        createdAt:serverTimestamp()
                    }
                );

            }

        }catch(error){

            console.error(
                "Profile error:",
                error
            );

        }

    }else{

        currentUser = null;

        loginPage.style.display = "flex";

        mainApp.classList.add("hidden");

    }

});


/* =====================================================
                        LOGOUT
====================================================== */

logoutBtn.onclick = async () => {

    try{

        await signOut(auth);

    }catch(error){

        console.error(error);

    }

};
