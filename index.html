<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToGeo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loginBox {
      width: 92%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      color: #1769ff;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: #1769ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup {
      background: #eaf1ff;
      color: #1769ff;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
    }


    /* MAIN APP */

    #mainApp {
      display: none;
      min-height: 100vh;
      background: #f5f7fb;
    }

    .topbar {
      height: 65px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .topLogo {
      font-size: 25px;
      font-weight: bold;
      color: #1769ff;
    }

    .logoutBtn {
      width: auto;
      padding: 10px 18px;
      margin: 0;
      background: #ff3b30;
      font-size: 14px;
    }

    .welcome {
      text-align: center;
      padding: 50px 20px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #777;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .feature {
      background: white;
      padding: 25px 15px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      font-size: 18px;
      font-weight: bold;
    }

    .feature span {
      display: block;
      font-size: 32px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>


  <!-- ========================= -->
  <!-- LOGIN PAGE -->
  <!-- ========================= -->

  <div id="loginPage">

    <div class="loginBox">

      <div class="logo">
        ToGeo
      </div>

      <div class="subtitle">
        Connect with everyone
      </div>

      <input
        id="email"
        type="email"
        placeholder="Email address"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button id="loginBtn">
        Login
      </button>

      <button
        id="signupBtn"
        class="signup"
      >
        Create Account
      </button>

      <div id="message"></div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- MAIN APP -->
  <!-- ========================= -->

  <div id="mainApp">

    <div class="topbar">

      <div class="topLogo">
        ToGeo
      </div>

      <button
        id="logoutBtn"
        class="logoutBtn"
      >
        Logout
      </button>

    </div>


    <div class="welcome">

      <h1>
        Welcome to ToGeo 🎉
      </h1>

      <p id="userEmail">
        You are logged in.
      </p>

    </div>


    <div class="features">

      <div class="feature">
        <span>💬</span>
        Chats
      </div>

      <div class="feature">
        <span>👥</span>
        Friends
      </div>

      <div class="feature">
        <span>🎬</span>
        Together
      </div>

      <div class="feature">
        <span>⭕</span>
        Status
      </div>

      <div class="feature">
        <span>📞</span>
        Calls
      </div>

      <div class="feature">
        <span>⚙️</span>
        Settings
      </div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- FIREBASE -->
  <!-- ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyCMYx-0G0gCJMhuV-uHZGoYqNQwkQtAUc8",

      authDomain:
        "togeo-8e24c.firebaseapp.com",

      projectId:
        "togeo-8e24c",

      storageBucket:
        "togeo-8e24c.firebasestorage.app",

      messagingSenderId:
        "772918055389",

      appId:
        "1:772918055389:web:14605859a71cf22860e634",

      measurementId:
        "G-DF8JCSHQCH"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    // ELEMENTS

    const loginPage =
      document.getElementById("loginPage");

    const mainApp =
      document.getElementById("mainApp");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const message =
      document.getElementById("message");

    const userEmail =
      document.getElementById("userEmail");


    function showMessage(
      text,
      success = false
    ) {

      message.textContent = text;

      message.style.color =
        success ? "green" : "red";
    }


    // =========================
    // CREATE ACCOUNT
    // =========================

    signupBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {

          showMessage(
            "Enter email and password."
          );

          return;
        }

        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters."
          );

          return;
        }


        try {

          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage(
            "Account created successfully!",
            true
          );

        } catch (error) {

          console.error(error);

          showMessage(
            error.code +
            " : " +
            error.message
          );
        }

      }
    );


    // =========================
    // LOGIN
    // =========================

    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {

          showMessage(
            "Enter email and password."
          );

          return;
        }


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage(
            "Login successful!",
            true
          );

        } catch (error) {

          console.error(error);

          showMessage(
            error.code +
            " : " +
            error.message
          );
        }

      }
    );


    // =========================
    // AUTH STATE
    // =========================

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          // USER LOGGED IN

          loginPage.style.display =
            "none";

          mainApp.style.display =
            "block";

          userEmail.textContent =
            "Logged in as: " +
            user.email;

          console.log(
            "MAIN APP OPENED:",
            user.email
          );

        } else {

          // USER LOGGED OUT

          loginPage.style.display =
            "flex";

          mainApp.style.display =
            "none";
        }

      }
    );


    // =========================
    // LOGOUT
    // =========================

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

        } catch (error) {

          console.error(error);

        }

      }
    );

  </script>

</body>
</html>
