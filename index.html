<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToGeo</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#111827;
}

button{
    border:none;
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:22px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    color:#1769ff;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin:8px 0 25px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
    margin-bottom:12px;
    outline:none;
}

input:focus{
    border-color:#1769ff;
}

.primaryBtn{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#1769ff;
    color:white;
    font-size:16px;
}

.secondaryBtn{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#eaf1ff;
    color:#1769ff;
    font-size:16px;
    margin-top:10px;
}

#message{
    text-align:center;
    min-height:22px;
    margin-top:15px;
    word-break:break-word;
}

/* MAIN APP */

#mainApp{
    min-height:100vh;
}

.topbar{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.topLogo{
    font-size:25px;
    font-weight:bold;
    color:#1769ff;
}

.logoutBtn{
    background:#ff3b30;
    color:white;
    padding:10px 17px;
    border-radius:10px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* NAV */

.nav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    background:white;
    padding:8px;
    border-radius:15px;
    margin-bottom:20px;
}

.nav button{
    padding:12px 5px;
    background:white;
    border-radius:10px;
    font-size:14px;
}

.nav button.active{
    background:#1769ff;
    color:white;
}

/* SECTIONS */

.section{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.section h2{
    margin-top:0;
}

/* HOME */

.home{
    text-align:center;
    padding:30px 10px;
}

.home p{
    color:#6b7280;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:25px;
}

.stat{
    padding:25px;
    background:#f8fafc;
    border-radius:15px;
}

.statNumber{
    font-size:28px;
    font-weight:bold;
    color:#1769ff;
}

/* SEARCH */

.searchRow{
    display:flex;
    gap:10px;
}

.searchRow input{
    margin:0;
    flex:1;
}

.searchBtn{
    padding:0 20px;
    border-radius:12px;
    background:#1769ff;
    color:white;
}

.result{
    margin-top:15px;
    padding:15px;
    border:1px solid #e5e7eb;
    border-radius:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.userName{
    font-weight:bold;
}

.userEmail{
    color:#6b7280;
    font-size:13px;
    word-break:break-all;
}

.smallBtn{
    background:#1769ff;
    color:white;
    padding:9px 13px;
    border-radius:9px;
}

.acceptBtn{
    background:#16a34a;
}

.rejectBtn{
    background:#ef4444;
}

/* LIST */

.listItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 5px;
    border-bottom:1px solid #e5e7eb;
    gap:10px;
}

.empty{
    text-align:center;
    color:#6b7280;
    padding:30px 10px;
}

/* CHAT LIST */

.chatItem{
    padding:15px;
    border-bottom:1px solid #e5e7eb;
    cursor:pointer;
}

.chatName{
    font-weight:bold;
}

.lastMessage{
    color:#6b7280;
    font-size:14px;
    margin-top:5px;
}

/* CHAT WINDOW */

#chatWindow{
    position:fixed;
    inset:0;
    background:#f1f5f9;
    z-index:100;
    display:none;
    flex-direction:column;
}

.chatHeader{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 15px;
}

.backBtn{
    background:#eef2ff;
    color:#1769ff;
    padding:9px 13px;
    border-radius:10px;
}

.chatTitle{
    font-weight:bold;
}

.chatMessages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.bubble{
    max-width:75%;
    padding:11px 14px;
    border-radius:15px;
    word-wrap:break-word;
}

.mine{
    align-self:flex-end;
    background:#1769ff;
    color:white;
}

.theirs{
    align-self:flex-start;
    background:white;
}

.chatInputArea{
    background:white;
    padding:10px;
    display:flex;
    gap:8px;
}

.chatInputArea input{
    margin:0;
    flex:1;
}

.sendBtn{
    width:70px;
    border-radius:12px;
    background:#1769ff;
    color:white;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .nav button{
        font-size:12px;
    }

    .searchRow{
        flex-direction:column;
    }

    .searchBtn{
        height:48px;
    }

    .result{
        align-items:flex-start;
    }

    .bubble{
        max-width:85%;
    }
}

</style>
</head>

<body>
<!-- ================= LOGIN PAGE ================= -->

    <div class="loginBox">

        <button

            Create Account
        </button>

        <div id="message"></div>

    </div>

</div>


<!-- ================= MAIN APP ================= -->

<div id="mainApp" class="hidden">

    <div class="topbar">

        <div class="topLogo">
            ToGeo
        </div>

        <button
            id="logoutBtn"
            class="logoutBtn"

        </button>

    </div>


    <div class="container">

        <!-- NAVIGATION -->

        <div class="nav">

</div>


<!-- ================= CHAT WINDOW ================= -->

<div id="chatWindow">

    <div class="chatHeader">

        <button
            id="backChatBtn"

            ← Back
        </button>


        <div
            id="chatTitle"
            class="chatTitle"
        >
            Chat
        </div>

    </div>


    <div
        id="chatMessages"
        class="chatMessages"
    >
    </div>


    <div class="chatInputArea">

        <input
            id="chatInput"

        <button

<!-- ================= FIREBASE ================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCMYx-0G0gCJMhuV-uHZGoYqNQwkQtAUc8",

    authDomain:
        "togeo-8e24c.firebaseapp.com",

    projectId:
        "togeo-8e24c",

    storageBucket:
        "togeo-8e24c.firebasestorage.app",

    messagingSenderId:
        "772918055389",

    appId:
        "1:772918055389:web:14605859a71cf22860e634",

    measurementId:
        "G-DF8JCSHQCH"
};


/* ================= INITIALIZE ================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ================= ELEMENTS ================= */

const loginPage =
    document.getElementById("loginPage");

const mainApp =
    document.getElementById("mainApp");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const signupBtn =
    document.getElementById("signupBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const message =
    document.getElementById("message");

const welcomeText =
    document.getElementById("welcomeText");


/* ================= CURRENT USER ================= */

let currentUser = null;


/* ================= MESSAGE ================= */

function showMessage(text, success = false){

    message.textContent = text;

    message.style.color =
        success ? "green" : "red";
}


/* =================================================
                  CREATE ACCOUNT
================================================= */

signupBtn.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(!email){

            showMessage(
                "Please enter your email."
            );

            return;
        }


        if(!password){

            showMessage(
                "Please enter your password."
            );

            return;
        }


        if(password.length < 6){

            showMessage(
                "Password must be at least 6 characters."
            );

            return;
        }


        signupBtn.disabled = true;

        loginBtn.disabled = true;


        showMessage(
            "Creating account...",
            true
        );


        try{

            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "ACCOUNT CREATED:",
                result.user.uid
            );


            /*
             Create user profile.
             If Firestore fails,
             login still works.
            */

            try{

                await setDoc(
                    doc(
                        db,
                        "users",
                        result.user.uid
                    ),
                    {
                        uid:
                            result.user.uid,

                        email:
                            result.user.email,

                        name:
                            result.user.email
                                .split("@")[0],

                        createdAt:
                            serverTimestamp()
                    }
                );

            }catch(profileError){

                console.error(
                    "PROFILE ERROR:",
                    profileError
                );

            }


            showMessage(
                "Account created successfully!",
                true
            );


        }catch(error){

            console.error(
                "CREATE ACCOUNT ERROR:",
                error
            );


            showMessage(
                error.code +
                " : " +
                error.message
            );


        }finally{

            signupBtn.disabled = false;

            loginBtn.disabled = false;

        }

    }
);


/* =================================================
                       LOGIN
================================================= */

loginBtn.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(!email){

            showMessage(
                "Please enter your email."
            );

            return;
        }


        if(!password){

            showMessage(
                "Please enter your password."
            );

            return;
        }


        loginBtn.disabled = true;

        signupBtn.disabled = true;


        showMessage(
            "Logging in...",
            true
        );


        try{

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "LOGIN SUCCESS:",
                result.user.uid
            );


            /*
             IMPORTANT:
             We don't manually open the app here.

             Firebase's onAuthStateChanged()
             will open the app automatically.
            */


        }catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            showMessage(
                error.code +
                " : " +
                error.message
            );


            loginBtn.disabled = false;

            signupBtn.disabled = false;

        }

    }
);


/* =================================================
                  AUTH STATE
================================================= */

onAuthStateChanged(
    auth,
    async function(user){

        console.log(
            "AUTH STATE:",
            user
                ? user.email
                : "LOGGED OUT"
        );


        if(user){

            /* =========================
               USER IS LOGGED IN
            ========================= */

            currentUser = user;


            /*
             IMPORTANT:
             Open the app immediately.
            */

            loginPage.style.display =
                "none";

            mainApp.classList.remove(
                "hidden"
            );


            welcomeText.textContent =
                "Logged in as: " +
                user.email;


            /*
             Make buttons usable again.
            */

            loginBtn.disabled = false;

            signupBtn.disabled = false;


            /*
             Create profile if missing.
             This does NOT control app opening.
            */

            try{

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userSnap =
                    await getDoc(userRef);


                if(!userSnap.exists()){

                    await setDoc(
                        userRef,
                        {
                            uid:
                                user.uid,

                            email:
                                user.email,

                            name:
                                user.email
                                    .split("@")[0],

                            createdAt:
                                serverTimestamp()
                        }
                    );

                }

            }catch(error){

                console.error(
                    "USER PROFILE ERROR:",
                    error
                );

            }


        }else{

            /* =========================
               USER IS LOGGED OUT
            ========================= */

            currentUser = null;


            loginPage.style.display =
                "flex";


            mainApp.classList.add(
                "hidden"
            );

        }

    }
);


/* =================================================
                       LOGOUT
================================================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        try{

            await signOut(auth);

        }catch(error){

            console.error(
                "LOGOUT ERROR:",
                error
            );

        }

    }
);


console.log(
    "ToGeo Firebase loaded successfully."
);

</script>
<script type="module">

import {
    collection,
    query,
    where,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    onSnapshot,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* ================= VARIABLES ================= */

let currentChatUser = null;
let unsubscribeMessages = null;


/* ================= NAVIGATION ================= */

function showSection(section){

    document
        .getElementById("homeSection")
        .classList.add("hidden");

    document
        .getElementById("chatsSection")
        .classList.add("hidden");

    document
        .getElementById("friendsSection")
        .classList.add("hidden");

    document
        .getElementById("requestsSection")
        .classList.add("hidden");


    if(section === "home"){

        document
            .getElementById("homeSection")
            .classList.remove("hidden");

    }


    if(section === "chats"){

        document
            .getElementById("chatsSection")
            .classList.remove("hidden");

        loadChats();

    }


    if(section === "friends"){

        document
            .getElementById("friendsSection")
            .classList.remove("hidden");

        loadFriends();

    }


    if(section === "requests"){

        document
            .getElementById("requestsSection")
            .classList.remove("hidden");

        loadRequests();

    }

}


/* ================= NAV BUTTONS ================= */

document
    .getElementById("navHome")
    .onclick = function(){

        showSection("home");

    };


document
    .getElementById("navChats")
    .onclick = function(){

        showSection("chats");

    };


document
    .getElementById("navFriends")
    .onclick = function(){

        showSection("friends");

    };


document
    .getElementById("navRequests")
    .onclick = function(){

        showSection("requests");

    };


/* ================= SEARCH USER ================= */

document
    .getElementById("searchBtn")
    .onclick = async function(){

        if(!currentUser){

            return;

        }


        const email =
            document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


        const resultBox =
            document.getElementById(
                "searchResult"
            );


        if(!email){

            resultBox.innerHTML =
                "<div class='empty'>Enter an email.</div>";

            return;

        }


        if(email === currentUser.email.toLowerCase()){

            resultBox.innerHTML =
                "<div class='empty'>You cannot add yourself.</div>";

            return;

        }


        resultBox.innerHTML =
            "<div class='empty'>Searching...</div>";


        try{

            const q =
                query(
                    collection(db, "users"),
                    where("email", "==", email)
                );


            const snapshot =
                await getDocs(q);


            if(snapshot.empty){

                resultBox.innerHTML =
                    "<div class='empty'>User not found.</div>";

                return;

            }


            const userDoc =
                snapshot.docs[0];


            const user =
                userDoc.data();


            resultBox.innerHTML = `

                <div class="userCard">

                    <div>
                        <strong>
                            ${user.name || email}
                        </strong>

                        <div>
                            ${user.email}
                        </div>
                    </div>

                    <button
                        class="primaryBtn"
                        id="sendRequestBtn"
                    >
                        Add Friend
                    </button>

                </div>

            `;


            document
                .getElementById("sendRequestBtn")
                .onclick = function(){

                    sendFriendRequest(
                        userDoc.id,
                        user.email
                    );

                };


        }catch(error){

            console.error(error);

            resultBox.innerHTML =
                "<div class='empty'>Search error.</div>";

        }

    };


/* ================= SEND FRIEND REQUEST ================= */

async function sendFriendRequest(
    toUid,
    toEmail
){

    if(!currentUser){

        return;

    }


    try{

        const existingQuery =
            query(
                collection(
                    db,
                    "friendRequests"
                ),
                where(
                    "fromUid",
                    "==",
                    currentUser.uid
                ),
                where(
                    "toUid",
                    "==",
                    toUid
                )
            );


        const existing =
            await getDocs(
                existingQuery
            );


        if(!existing.empty){

            alert(
                "Friend request already sent."
            );

            return;

        }


        await addDoc(
            collection(
                db,
                "friendRequests"
            ),
            {

                fromUid:
                    currentUser.uid,

                fromEmail:
                    currentUser.email,

                toUid:
                    toUid,

                toEmail:
                    toEmail,

                status:
                    "pending",

                createdAt:
                    serverTimestamp()

            }
        );


        alert(
            "Friend request sent!"
        );


    }catch(error){

        console.error(error);

        alert(
            "Could not send request."
        );

    }

}


/* ================= LOAD REQUESTS ================= */

async function loadRequests(){

    if(!currentUser){

        return;

    }


    const box =
        document.getElementById(
            "requestsList"
        );


    box.innerHTML =
        "<div class='empty'>Loading...</div>";


    try{

        const q =
            query(
                collection(
                    db,
                    "friendRequests"
                ),
                where(
                    "toUid",
                    "==",
                    currentUser.uid
                ),
                where(
                    "status",
                    "==",
                    "pending"
                )
            );


        const snapshot =
            await getDocs(q);


        box.innerHTML = "";


        if(snapshot.empty){

            box.innerHTML =
                "<div class='empty'>No friend requests.</div>";

            document
                .getElementById("requestCount")
                .textContent = "0";

            return;

        }


        document
            .getElementById("requestCount")
            .textContent =
            snapshot.size;


        snapshot.forEach(
            function(requestDoc){

                const request =
                    requestDoc.data();


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "userCard";


                card.innerHTML = `

                    <div>

                        <strong>
                            ${request.fromEmail}
                        </strong>

                        <div>
                            Wants to be your friend
                        </div>

                    </div>

                    <div>

                        <button
                            class="primaryBtn"
                            data-action="accept"
                        >
                            Accept
                        </button>

                        <button
                            class="secondaryBtn"
                            data-action="reject"
                        >
                            Reject
                        </button>

                    </div>

                `;


                card
                    .querySelector(
                        '[data-action="accept"]'
                    )
                    .onclick = function(){

                        acceptRequest(
                            requestDoc.id,
                            request
                        );

                    };


                card
                    .querySelector(
                        '[data-action="reject"]'
                    )
                    .onclick = function(){

                        rejectRequest(
                            requestDoc.id
                        );

                    };


                box.appendChild(card);

            }
        );


    }catch(error){

        console.error(error);

        box.innerHTML =
            "<div class='empty'>Could not load requests.</div>";

    }

}


/* ================= ACCEPT REQUEST ================= */

async function acceptRequest(
    requestId,
    request
){

    try{

        const chatId =
            [currentUser.uid, request.fromUid]
                .sort()
                .join("_");


        await setDoc(
            doc(
                db,
                "friends",
                chatId
            ),
            {

                users: [
                    currentUser.uid,
                    request.fromUid
                ],

                emails: [
                    currentUser.email,
                    request.fromEmail
                ],

                createdAt:
                    serverTimestamp()

            }
        );


        await updateDoc(
            doc(
                db,
                "friendRequests",
                requestId
            ),
            {
                status: "accepted"
            }
        );


        alert(
            "Friend added successfully!"
        );


        loadRequests();

        loadFriends();


    }catch(error){

        console.error(error);

        alert(
            "Could not accept request."
        );

    }

}


/* ================= REJECT REQUEST ================= */

async function rejectRequest(
    requestId
){

    try{

        await deleteDoc(
            doc(
                db,
                "friendRequests",
                requestId
            )
        );


        loadRequests();


    }catch(error){

        console.error(error);

    }

}


/* ================= LOAD FRIENDS ================= */

async function loadFriends(){

    if(!currentUser){

        return;

    }


    const box =
        document.getElementById(
            "friendsList"
        );


    box.innerHTML =
        "<div class='empty'>Loading...</div>";


    try{

        const q =
            query(
                collection(
                    db,
                    "friends"
                ),
                where(
                    "users",
                    "array-contains",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(q);


        box.innerHTML = "";


        document
            .getElementById("friendCount")
            .textContent =
            snapshot.size;


        if(snapshot.empty){

            box.innerHTML =
                "<div class='empty'>No friends yet.</div>";

            return;

        }


        snapshot.forEach(
            function(friendDoc){

                const friend =
                    friendDoc.data();


                const index =
                    friend.users.indexOf(
                        currentUser.uid
                    );


                const friendUid =
                    friend.users[
                        index === 0 ? 1 : 0
                    ];


                const friendEmail =
                    friend.emails[
                        index === 0 ? 1 : 0
                    ];


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "userCard";


                card.innerHTML = `

                    <div>

                        <strong>
                            ${friendEmail}
                        </strong>

                    </div>

                    <button
                        class="primaryBtn"
                    >
                        Chat
                    </button>

                `;


                card
                    .querySelector("button")
                    .onclick = function(){

                        openChat(
                            friendUid,
                            friendEmail
                        );

                    };


                box.appendChild(card);

            }
        );


    }catch(error){

        console.error(error);

        box.innerHTML =
            "<div class='empty'>Could not load friends.</div>";

    }

}


/* ================= OPEN CHAT ================= */

function openChat(
    uid,
    email
){

    currentChatUser = {

        uid: uid,

        email: email

    };


    document
        .getElementById("chatTitle")
        .textContent =
        email;


    document
        .getElementById("chatWindow")
        .classList.add("open");


    loadMessages();

}


/* ================= CLOSE CHAT ================= */

document
    .getElementById("backChatBtn")
    .onclick = function(){

        document
            .getElementById("chatWindow")
            .classList.remove("open");


        if(unsubscribeMessages){

            unsubscribeMessages();

            unsubscribeMessages = null;

        }

    };


/* ================= LOAD MESSAGES ================= */

function loadMessages(){

    if(!currentUser || !currentChatUser){

        return;

    }


    if(unsubscribeMessages){

        unsubscribeMessages();

    }


    const chatId =
        [currentUser.uid, currentChatUser.uid]
            .sort()
            .join("_");


    const messagesQuery =
        query(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            orderBy(
                "createdAt",
                "asc"
            )
        );


    unsubscribeMessages =
        onSnapshot(
            messagesQuery,
            function(snapshot){

                const box =
                    document.getElementById(
                        "chatMessages"
                    );


                box.innerHTML = "";


                snapshot.forEach(
                    function(messageDoc){

                        const msg =
                            messageDoc.data();


                        const div =
                            document.createElement(
                                "div"
                            );


                        div.className =
                            msg.fromUid === currentUser.uid
                            ? "message mine"
                            : "message theirs";


                        div.textContent =
                            msg.text;


                        box.appendChild(div);

                    }
                );


                box.scrollTop =
                    box.scrollHeight;

            },
            function(error){

                console.error(
                    "MESSAGE ERROR:",
                    error
                );

            }
        );

}


/* ================= SEND MESSAGE ================= */

document
    .getElementById("sendBtn")
    .onclick = sendMessage;


document
    .getElementById("chatInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                sendMessage();

            }

        }
    );


async function sendMessage(){

    if(!currentUser){

        return;

    }


    if(!currentChatUser){

        return;

    }


    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    const chatId =
        [currentUser.uid, currentChatUser.uid]
            .sort()
            .join("_");


    try{

        await addDoc(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            {

                text: text,

                fromUid:
                    currentUser.uid,

                fromEmail:
                    currentUser.email,

                toUid:
                    currentChatUser.uid,

                createdAt:
                    serverTimestamp()

            }
        );


        input.value = "";


    }catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        alert(
            "Message could not be sent."
        );

    }

}


/* ================= LOAD CHATS ================= */

async function loadChats(){

    if(!currentUser){

        return;

    }


    const box =
        document.getElementById(
            "chatList"
        );


    box.innerHTML =
        "<div class='empty'>Open Friends to start a chat.</div>";

}

document
    .getElementById("navHome")
    .classList.add("active");

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                document
                    .getElementById("searchBtn")
                    .click();

            }

        }
    );


</script>
