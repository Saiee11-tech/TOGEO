<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToGeo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    button {
      border: none;
      cursor: pointer;
    }

    input {
      outline: none;
    }

    .hidden {
      display: none !important;
    }

    /* ================= AUTH ================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #1769ff, #7048ff);
    }

    .authBox {
      width: 100%;
      max-width: 390px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      color: #1769ff;
      font-size: 40px;
      font-weight: bold;
    }

    .tagline {
      text-align: center;
      color: #777;
      margin: 5px 0 25px;
    }

    .authInput {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .primaryBtn {
      width: 100%;
      padding: 14px;
      background: #1769ff;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 8px;
    }

    .secondaryBtn {
      width: 100%;
      padding: 14px;
      background: #edf3ff;
      color: #1769ff;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 10px;
    }

    #authMessage {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      word-break: break-word;
    }

    /* ================= APP ================= */

    #appScreen {
      min-height: 100vh;
      max-width: 1000px;
      margin: auto;
      background: white;
      position: relative;
    }

    .topBar {
      height: 62px;
      background: #1769ff;
      color: white;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topLogo {
      font-size: 25px;
      font-weight: bold;
    }

    .logoutBtn {
      background: rgba(255,255,255,0.2);
      color: white;
      padding: 9px 13px;
      border-radius: 8px;
    }

    .content {
      padding: 20px;
      padding-bottom: 90px;
    }

    .sectionTitle {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    /* SEARCH */

    .searchArea {
      display: flex;
      gap: 8px;
    }

    .searchArea input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .searchBtn {
      width: 85px;
      background: #1769ff;
      color: white;
      border-radius: 10px;
    }

    .resultCard,
    .chatCard {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .emailText {
      font-weight: bold;
      word-break: break-word;
    }

    .smallText {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
      word-break: break-word;
    }

    .chatOpenBtn {
      background: #1769ff;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    /* ================= CARDS ================= */

    .featureCard {
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #1769ff, #7048ff);
      color: white;
    }

    .featureCard h3 {
      margin-top: 0;
    }

    .featureBtn {
      background: white;
      color: #1769ff;
      padding: 10px 15px;
      border-radius: 9px;
      margin-top: 8px;
    }

    .settingCard {
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    /* ================= BOTTOM NAV ================= */

    .bottomNav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1000px;
      height: 68px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 5;
    }

    .navBtn {
      background: transparent;
      color: #777;
      font-size: 12px;
    }

    .navIcon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .navBtn.active {
      color: #1769ff;
    }

    /* ================= CHAT ================= */

    #chatScreen {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .chatHeader {
      height: 62px;
      background: #1769ff;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }

    .backBtn {
      background: transparent;
      color: white;
      font-size: 28px;
      width: 40px;
    }

    .chatHeaderTitle {
      font-size: 17px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #f2f5f9;
    }

    .message {
      max-width: 78%;
      padding: 10px 13px;
      margin-bottom: 9px;
      border-radius: 14px;
      word-break: break-word;
    }

    .sent {
      background: #1769ff;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .received {
      background: white;
      color: #222;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .messageTime {
      font-size: 10px;
      opacity: .7;
      margin-top: 4px;
    }

    .messageInputArea {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .messageInputArea input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .sendBtn {
      width: 65px;
      background: #1769ff;
      color: white;
      border-radius: 10px;
    }

    @media (min-width: 700px) {
      #appScreen {
        min-height: 100vh;
        box-shadow: 0 0 30px rgba(0,0,0,.08);
      }
    }
  </style>
</head>

<body>

<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<div id="authScreen">

  <div class="authBox">

    <div class="logo">ToGeo</div>

    <div class="tagline">

    </div>

    <input
      id="email"

    >

    <button

    </button>

    <button
      id="signupBtn"

    >
      Create Account
    </button>

    <div id="authMessage"></div>

  </div>

</div>


<!-- =====================================================
     MAIN APP
===================================================== -->

<div id="appScreen" class="hidden">

  <div class="topBar">

    <div class="topLogo">
      ToGeo
    </div>

    <button
      id="logoutBtn"
      class="logoutBtn"
    >
      Logout
    </button>

  </div>


  <div class="content">

    <!-- ================= CHATS PAGE ================= -->

    <div id="homePage">

      <div class="sectionTitle">

      </div>

      <div class="searchArea">

        <input
          id="searchEmail"

    <!-- ================= STATUS PAGE ================= -->

    <div

    <!-- ================= SETTINGS PAGE ================= -->

    <div

    >

      <div class="sectionTitle">

      </div>

        <b>Account</b>

        <p

        ></p>

      <div class="settingCard">

      </div>

      <div class="settingCard">

      </div>

      <div class="settingCard">

      </div>

  </div>


  <!-- ================= NAVIGATION ================= -->

  <div class="bottomNav">

    <button

    >
      <span class="navIcon">💬</span>

    </button>

    <button
      id="togetherNav"
      class="navBtn"
    >
      <span class="navIcon">🎬</span>
      Together
    </button>

    <button
      id="statusNav"
      class="navBtn"
    >
      <span class="navIcon">⭕</span>
      Status
    </button>

    <button
      id="settingsNav"
      class="navBtn"
    >
      <span class="navIcon">⚙️</span>

</div>


<!-- =====================================================
     CHAT SCREEN
===================================================== -->

<div
  id="chatScreen"
  class="hidden"
>

  <div class="chatHeader">

    <button
      id="backChatBtn"

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    onSnapshot,
    serverTimestamp,
    orderBy
  } from
  "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


  /* =====================================================
     FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCMU-0G0gCJMhuV-uHZGoYqNQwkQtAUc8",

    authDomain:
      "togeo-8e24c.firebaseapp.com",

    projectId:
      "togeo-8e24c",

    storageBucket:
      "togeo-8e24c.firebasestorage.app",

    messagingSenderId:
      "772918055389",

    appId:
      "1:772918055389:web:14605859a71cf22860e634",

    measurementId:
      "G-DF8JCSHQCH"
  };


  /* =====================================================
     INITIALIZE FIREBASE
  ===================================================== */

  let app;
  let auth;
  let db;

  try {

    app = initializeApp(firebaseConfig);

    auth = getAuth(app);

    db = getFirestore(app);

  } catch (error) {

    document.getElementById("authMessage").textContent =
      "Firebase initialization error: " +
      error.message;

  }


  /* =====================================================
     VARIABLES
  ===================================================== */

  let currentUser = null;

  let currentChatId = null;

  let currentOtherUser = null;

  let stopMessagesListener = null;

  let stopChatsListener = null;


  /* =====================================================
     LOGIN
  ===================================================== */

  document
    .getElementById("loginBtn")
    .addEventListener(
      "click",
      async function () {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          document
            .getElementById("authMessage")
            .textContent =
              "Please enter email and password.";

          return;

        }


        document
          .getElementById("authMessage")
          .textContent =
            "Logging in...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          document
            .getElementById("authMessage")
            .textContent =
              "Login successful ✅";


        } catch (error) {

          console.error(error);

          document
            .getElementById("authMessage")
            .textContent =
              error.code +
              " : " +
              error.message;

        }

      }
    );


  /* =====================================================
     CREATE ACCOUNT
  ===================================================== */

  document
    .getElementById("signupBtn")
    .addEventListener(
      "click",
      async function () {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          document
            .getElementById("authMessage")
            .textContent =
              "Please enter email and password.";

          return;

        }


        if (password.length < 6) {

          document
            .getElementById("authMessage")
            .textContent =
              "Password must be at least 6 characters.";

          return;

        }


        document
          .getElementById("authMessage")
          .textContent =
            "Creating account...";


        try {

          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            result.user;


          try {

            await setDoc(
              doc(
                db,
                "users",
                user.uid
              ),
              {
                uid: user.uid,
                email: user.email,
                createdAt: serverTimestamp()
              }
            );

          } catch (firestoreError) {

            console.error(
              "Profile save error:",
              firestoreError
            );

          }


          document
            .getElementById("authMessage")
            .textContent =
              "Account created successfully ✅";

        } catch (error) {

          console.error(error);

          document
            .getElementById("authMessage")
            .textContent =
              error.code +
              " : " +
              error.message;

        }

      }
    );


  /* =====================================================
     AUTH STATE
  ===================================================== */

  onAuthStateChanged(
    auth,
    async function (user) {

      if (user) {

        currentUser = user;


        /*
          IMPORTANT:
          Show the app immediately after login.
          Firestore errors should not block the app.
        */

        document
          .getElementById("authScreen")
          .classList
          .add("hidden");


        document
          .getElementById("appScreen")
          .classList
          .remove("hidden");


        document
          .getElementById("accountEmail")
          .textContent =
            user.email;


        /*
          Try to create profile.
          If it fails, app still opens.
        */

        try {

          await ensureUserProfile();

        } catch (error) {

          console.error(
            "Profile error:",
            error
          );

        }


        /*
          Try to load chats.
        */

        try {

          loadChats();

        } catch (error) {

          console.error(
            "Chat loading error:",
            error
          );

        }


      } else {

        currentUser = null;

        document
          .getElementById("authScreen")
          .classList
          .remove("hidden");


        document
          .getElementById("appScreen")
          .classList
          .add("hidden");


        document
          .getElementById("chatScreen")
          .classList
          .add("hidden");

      }

    }
  );


  /* =====================================================
     ENSURE USER PROFILE
  ===================================================== */

  async function ensureUserProfile() {

    if (!currentUser) return;


    const userRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const snapshot =
      await getDoc(userRef);


    if (!snapshot.exists()) {

      await setDoc(
        userRef,
        {
          uid:
            currentUser.uid,

          email:
            currentUser.email,

          createdAt:
            serverTimestamp()
        }
      );

    }

  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async function () {

        try {

          await signOut(auth);

        } catch (error) {

          alert(error.message);

        }

      }
    );


  /* =====================================================
     SEARCH USER
  ===================================================== */

  document
    .getElementById("searchBtn")
    .addEventListener(
      "click",
      searchUser
    );


  document
    .getElementById("searchEmail")
    .addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          searchUser();

        }

      }
    );


  async function searchUser() {
