<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>ToGeo</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#111827;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
    border:none;
}

.hidden{
    display:none !important;
}

/* =========================
   LOGIN
========================= */

#loginPage{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
    linear-gradient(
        135deg,
        #eef4ff,
        #ffffff
    );

}

.loginBox{

    width:100%;

    max-width:420px;

    background:#ffffff;

    padding:30px 24px;

    border-radius:20px;

    box-shadow:
    0 12px 40px
    rgba(0,0,0,.12);

}

.logo{

    text-align:center;

    font-size:40px;

    font-weight:800;

    color:#1769ff;

}

.tagline{

    text-align:center;

    color:#64748b;

    margin-top:6px;

    margin-bottom:25px;

}

.field{

    margin-bottom:16px;

}

.field label{

    display:block;

    font-size:14px;

    font-weight:bold;

    margin-bottom:7px;

}

.field input{

    width:100%;

    padding:14px;

    border:1px solid #d1d5db;

    border-radius:10px;

    outline:none;

}

.field input:focus{

    border-color:#1769ff;

}

.authButtons{

    display:flex;

    gap:10px;

    margin-top:20px;

}

.authButtons button{

    flex:1;

    padding:14px;

    border-radius:10px;

    font-weight:bold;

}

.primary{

    background:#1769ff;

    color:#ffffff;

}

.secondary{

    background:#e8edf5;

    color:#111827;

}

#message{

    min-height:22px;

    text-align:center;

    margin-top:15px;

    font-size:14px;

    font-weight:bold;

}

/* =========================
   MAIN APP
========================= */

#mainApp{

    min-height:100vh;

}

.topBar{

    height:60px;

    background:#ffffff;

    border-bottom:
    1px solid #e5e7eb;

    display:flex;

    align-items:center;

}

.topLogo{

.logoutBtn{

.nav{

    overflow-x:auto;

    background:#ffffff;

    padding:7px;

    gap:5px;

    position:sticky;

    top:60px;

    z-index:9;

}

.nav button{

    white-space:nowrap;

    background:transparent;

    padding:10px 14px;

    border-radius:9px;

    color:#475569;

    font-weight:bold;

}

    background:#e8f0ff;

    color:#1769ff;

}

.content{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:18px;

}

.section{

    display:none;

}

.section.active{

    display:block;

}

/* =========================
   CARDS
========================= */

.card{

    background:#ffffff;

    border:
    1px solid #e5e7eb;

    border-radius:15px;

    padding:17px;

    margin-bottom:12px;

    box-shadow:
    0 3px 12px

}

.card h2{

    margin-bottom:7px;

}

.muted{

    color:#64748b;

    font-size:14px;

}

.stats{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:18px;

}

.stat{

    padding:18px;

    background:#f8fafc;

    border-radius:12px;

    border:
    1px solid #e5e7eb;

}

.stat b{

    display:block;

    font-size:28px;

    color:#1769ff;

    margin-top:5px;

}

/* =========================
   SEARCH
========================= */

.searchBox{

    display:flex;

    gap:8px;

    margin-top:15px;

}

.searchBox input{

    flex:1;

    padding:13px;

    border:
    1px solid #d1d5db;

    border-radius:10px;

    outline:none;

}

.searchBox input:focus{

    border-color:#1769ff;

}

.searchBox button{

    padding:0 17px;

    border-radius:10px;

}

/* =========================
   USER ROW
========================= */

.row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

}

.user{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;

}

.avatar{

    width:44px;

    height:44px;

    min-width:44px;

    border-radius:50%;

    background:#1769ff;

    color:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;

}

.user h3{

    font-size:15px;

}

.user p{

    font-size:12px;

    color:#64748b;

    overflow:hidden;

    text-overflow:ellipsis;

}

.smallBtn{

    padding:9px 12px;

    border-radius:8px;

    font-weight:bold;

}

.success{

    background:#dcfce7;

    color:#15803d;

}

.danger{

    background:#fee2e2;

    color:#b91c1c;

}

.empty{

    text-align:center;

    color:#64748b;

    padding:25px;

}

.error{

    color:#dc2626;

}

.ok{

    color:#16a34a;

}

/* =========================
   CHAT
========================= */

#chatWindow{

    position:fixed;

    inset:0;

    background:#f8fafc;

    z-index:50;

    display:none;

    flex-direction:column;

}

.chatHeader{

    height:60px;

    background:#ffffff;

    border-bottom:
    1px solid #e5e7eb;

    display:flex;

    align-items:center;

}

.backBtn{

    border-radius:8px;

}

.chatTitle{

    font-weight:bold;

}

#chatMessages{

    flex:1;

    padding:15px;

}

.messageBubble{

    max-width:78%;

    padding:10px 12px;

    border-radius:14px;

    margin:6px 0;

    word-wrap:break-word;

}

.myMessage{

    margin-left:auto;

    background:#1769ff;

    color:#ffffff;

    border-bottom-right-radius:4px;

}

.otherMessage{

    background:#ffffff;

    border:
    1px solid #e5e7eb;

    border-bottom-left-radius:4px;

}

.chatInputArea{

    display:flex;

    gap:8px;

    background:#ffffff;

    border-top:
    1px solid #e5e7eb;

    padding:10px;

}

.chatInputArea input{

    flex:1;

    padding:13px;

    border:
    1px solid #d1d5db;

    border-radius:10px;

    outline:none;

}

.chatInputArea button{

    padding:0 17px;

    border-radius:10px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .content{

        padding:13px;

    }

    .loginBox{

        padding:25px 20px;

    }

    .row{

        align-items:flex-start;

    }

    .smallBtn{

        padding:8px 10px;

    }

}

</style>

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    updateDoc,
    doc,
    setDoc,
    getDoc,
    onSnapshot,
    orderBy,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyCMYx-0Gg0CJMhuV-uHZGoYqNQwkQtAUc8",

    authDomain:
    "togeo-8e24c.firebaseapp.com",

    projectId:
    "togeo-8e24c",

    storageBucket:
    "togeo-8e24c.firebasestorage.app",

    messagingSenderId:
    "772918055389",

    appId:
    "1:772918055389:web:14605859a71cf22860e634",

    measurementId:
    "G-DF8JCSHQCH"
};


/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let currentChatFriend = null;

let unsubscribeMessages = null;


/* =========================
   SHORT SELECTOR
========================= */

const $ = function(id){

    return document.getElementById(id);

};


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    success = false
){

    const box =
        $("message");

    box.textContent =
        text;

    box.style.color =
        success
        ? "#16a34a"
        : "#dc2626";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function(char){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[char];

            }
        );

}


/* =========================
   USER NAME
========================= */

function getUserName(user){

    if(
        user &&
        user.name
    ){

        return user.name;

    }


    if(
        user &&
        user.email
    ){

        return user.email
            .split("@")[0];

    }


    return "User";

}


/* =========================
   CHAT ID
========================= */

function createChatId(
    uid1,
    uid2
){

    return [
        uid1,
        uid2
    ]
    .sort()
    .join("_");

}


/* =========================
   CREATE PROFILE
========================= */

async function createUserProfile(user){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    const snap =
        await getDoc(userRef);


    if(
        !snap.exists()
    ){

        await setDoc(
            userRef,
            {

                uid:user.uid,

                email:user.email,

                name:
                user.email
                    .split("@")[0],

                createdAt:
                serverTimestamp()

            }
        );

    }

}


/* =========================
   FIREBASE ERROR
========================= */

function firebaseError(error){

    const code =
        error.code || "";


    if(
        code ===
        "auth/invalid-credential"
    ){

        return "Incorrect email or password.";

    }


    if(
        code ===
        "auth/invalid-email"
    ){

        return "Invalid email address.";

    }


    if(
        code ===
        "auth/email-already-in-use"
    ){

        return "This email is already registered.";

    }


    if(
        code ===
        "auth/weak-password"
    ){

        return "Password must be at least 6 characters.";

    }


    if(
        code ===
        "auth/network-request-failed"
    ){

        return "Internet connection problem.";

    }


    return (
        error.message ||
        "Something went wrong."
    );

}


/* =========================
   SIGN UP
========================= */

async function signupUser(){

    const email =
        $("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        $("password")
        .value;


    if(!email){

        showMessage(
            "Please enter your email."
        );

        return;

    }


    if(!password){

        showMessage(
            "Please enter your password."
        );

        return;

    }


    if(
        password.length < 6
    ){

        showMessage(
            "Password must be at least 6 characters."
        );

        return;

    }


    $("loginBtn").disabled =
        true;

    $("signupBtn").disabled =
        true;


    showMessage(
        "Creating account...",
        true
    );


    try{

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            result.user;


        try{

            await createUserProfile(
                user
            );

        }
        catch(profileError){

            console.error(
                "PROFILE ERROR:",
                profileError
            );

        }


        showMessage(
            "Account created successfully!",
            true
        );

    }
    catch(error){

        console.error(
            "SIGNUP ERROR:",
            error
        );


        showMessage(
            firebaseError(error)
        );

    }
    finally{

        $("loginBtn").disabled =
            false;

        $("signupBtn").disabled =
            false;

    }

}


/* =========================
   LOGIN
========================= */

async function loginUser(){

    const email =
        $("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        $("password")
        .value;


    if(!email){

        showMessage(
            "Please enter your email."
        );

        return;

    }


    if(!password){

        showMessage(
            "Please enter your password."
        );

        return;

    }


    $("loginBtn").disabled =
        true;

    $("signupBtn").disabled =
        true;


    showMessage(
        "Logging in...",
        true
    );


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        showMessage(
            "Login successful!",
            true
        );

    }
    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            firebaseError(error)
        );

    }
    finally{

        $("loginBtn").disabled =
            false;

        $("signupBtn").disabled =
            false;

    }

}


/* =========================
   BUTTONS
========================= */

$("signupBtn")
.addEventListener(
    "click",
    signupUser
);


$("loginBtn")
.addEventListener(
    "click",
    loginUser
);


$("password")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            loginUser();

        }

    }
);


/* =========================
   LOGOUT
========================= */

$("logoutBtn")
.addEventListener(
    "click",
    async function(){

        try{

            await signOut(auth);

        }
        catch(error){

            console.error(
                "LOGOUT ERROR:",
                error
            );

        }

    }
);


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(user){

            currentUser =
                user;


            try{

                await createUserProfile(
                    user
                );

            }
            catch(error){

                console.error(
                    "PROFILE ERROR:",
                    error
                );

            }


            $("loginPage")
                .classList
                .add("hidden");


            $("mainApp")
                .classList
                .remove("hidden");


            $("welcomeText")
                .textContent =
                "Welcome, " +
                user.email;


            $("accountEmail")
                .textContent =
                user.email;


            loadHomeStats();

        }
        else{

            currentUser =
                null;


            $("mainApp")
                .classList
                .add("hidden");


            $("loginPage")
                .classList
                .remove("hidden");

        }

    });


/* =========================
   NAVIGATION
========================= */

document
.querySelectorAll(".navBtn")
.forEach(function(button){

    button.addEventListener(
        "click",
        function(){

            showSection(
                button.dataset.section
            );

        }
    );

});


function showSection(
    sectionName
){

    document
    .querySelectorAll(".section")
    .forEach(function(section){

        section
        .classList
        .remove("active");

    });


    const selected =
        $(sectionName + "Section");


    if(selected){

        selected
        .classList
        .add("active");

    }


    document
    .querySelectorAll(".navBtn")
    .forEach(function(button){

        button
        .classList
        .toggle(
            "active",
            button.dataset.section ===
            sectionName
        );

    });


    if(
        sectionName === "home"
    ){

        loadHomeStats();

    }


    if(
        sectionName === "friends"
    ){

        loadFriends();

    }


    if(
        sectionName === "requests"
    ){

        loadRequests();

    }


    if(
        sectionName === "chats"
    ){

        loadChats();

    }

}
/* =========================
   HOME STATS
========================= */

async function loadHomeStats(){

    if(!currentUser) return;


    try{

        const friendsSnapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "friends"
                    ),
                    where(
                        "users",
                        "array-contains",
                        currentUser.uid
                    )
                )
            );


        $("friendCount")
            .textContent =
            friendsSnapshot.size;


        const requestsSnapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "friendRequests"
                    ),
                    where(
                        "toUid",
                        "==",
                        currentUser.uid
                    )
                )
            );


        let pending = 0;


        requestsSnapshot.forEach(
            function(item){

                if(
                    item.data().status ===
                    "pending"
                ){

                    pending++;

                }

            }
        );


        $("requestCount")
            .textContent =
            pending;

    }
    catch(error){

        console.error(
            "STATS ERROR:",
            error
        );

    }

}


/* =========================
   SEARCH EVENTS
========================= */

$("searchBtn")
.addEventListener(
    "click",
    searchUser
);


$("searchInput")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            searchUser();

        }

    }
);


/* =========================
   SEARCH USER
========================= */

async function searchUser(){

    if(!currentUser) return;


    const email =
        $("searchInput")
        .value
        .trim()
        .toLowerCase();


    const result =
        $("searchResult");


    if(!email){

        result.innerHTML =
        `
        <div class="card error">
            Please enter an email address.
        </div>
        `;

        return;

    }


    if(
        email ===
        currentUser.email.toLowerCase()
    ){

        result.innerHTML =
        `
        <div class="card">
            You cannot add yourself.
        </div>
        `;

        return;

    }


    result.innerHTML =
    `
    <div class="card">
        Searching...
    </div>
    `;


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "users"
                    ),
                    where(
                        "email",
                        "==",
                        email
                    )
                )
            );


        if(snapshot.empty){

            result.innerHTML =
            `
            <div class="card empty">
                User not found.
            </div>
            `;

            return;

        }


        const userDoc =
            snapshot.docs[0];


        const user =
            userDoc.data();


        const targetUid =
            userDoc.id;


        /* CHECK FRIEND */

        const friendsSnapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "friends"
                    ),
                    where(
                        "users",
                        "array-contains",
                        currentUser.uid
                    )
                )
            );


        let alreadyFriends =
            false;


        friendsSnapshot.forEach(
            function(item){

                const data =
                    item.data();


                if(
                    data.users &&
                    data.users.includes(
                        targetUid
                    )
                ){

                    alreadyFriends =
                        true;

                }

            }
        );


        if(alreadyFriends){

            result.innerHTML =
            `
            <div class="card">

                <div class="row">

                    <div class="user">

                        <div class="avatar">
                            ${escapeHTML(
                                getUserName(user)
                                .charAt(0)
                                .toUpperCase()
                            )}
                        </div>

                        <div>

                            <h3>
                                ${escapeHTML(
                                    getUserName(user)
                                )}
                            </h3>

                            <p>
                                ${escapeHTML(
                                    user.email
                                )}
                            </p>

                        </div>

                    </div>

                    <span class="ok">
                        Friends ✓
                    </span>

                </div>

            </div>
            `;

            return;

        }


        /* CHECK REQUEST */

        const requestSnapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "friendRequests"
                    ),
                    where(
                        "fromUid",
                        "==",
                        currentUser.uid
                    )
                )
            );


        let requestSent =
            false;


        requestSnapshot.forEach(
            function(item){

                const data =
                    item.data();


                if(
                    data.toUid ===
                    targetUid &&
                    data.status ===
                    "pending"
                ){

                    requestSent =
                        true;

                }

            }
        );


        result.innerHTML =
        `
        <div class="card">

            <div class="row">

                <div class="user">

                    <div class="avatar">

                        ${escapeHTML(
                            getUserName(user)
                            .charAt(0)
                            .toUpperCase()
                        )}

                    </div>

                    <div>

                        <h3>
                            ${escapeHTML(
                                getUserName(user)
                            )}
                        </h3>

                        <p>
                            ${escapeHTML(
                                user.email
                            )}
                        </p>

                    </div>

                </div>


                ${
                    requestSent

                    ?

                    `
                    <button
                        type="button"
                        class="smallBtn secondary"
                        disabled>
                        Request Sent
                    </button>
                    `

                    :

                    `
                    <button
                        type="button"
                        id="addFriendBtn"
                        class="smallBtn primary">
                        Add Friend
                    </button>
                    `
                }

            </div>

        </div>
        `;


        if(!requestSent){

            $("addFriendBtn")
            .addEventListener(
                "click",
                function(){

                    sendFriendRequest(
                        targetUid,
                        user.email
                    );

                }
            );

        }

    }
    catch(error){

        console.error(
            "SEARCH ERROR:",
            error
        );


        result.innerHTML =
        `
        <div class="card error">
            ${escapeHTML(
                error.message
            )}
        </div>
        `;

    }

}


/* =========================
   SEND REQUEST
========================= */

async function sendFriendRequest(
    targetUid,
    targetEmail
){

    if(!currentUser) return;


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "friendRequests"
                    ),
                    where(
                        "fromUid",
                        "==",
                        currentUser.uid
                    )
                )
            );


        let exists =
            false;


        snapshot.forEach(
            function(item){

                const data =
                    item.data();


                if(
                    data.toUid ===
                    targetUid &&
                    data.status ===
                    "pending"
                ){

                    exists =
                    true;

                }

            }
        );


        if(exists){

            $("searchResult")
            .innerHTML =
            `
            <div class="card">
                Request already sent.
            </div>
            `;

            return;

        }


        await addDoc(
            collection(
                db,
                "friendRequests"
            ),
            {

                fromUid:
                    currentUser.uid,

                fromEmail:
                    currentUser.email,

                toUid:
                    targetUid,

                toEmail:
                    targetEmail,

                status:
                    "pending",

                createdAt:
                    serverTimestamp()

            }
        );


        $("searchResult")
        .innerHTML =
        `
        <div class="card ok">
            Friend request sent successfully ✓
        </div>
        `;


        loadHomeStats();

    }
    catch(error){

        console.error(
            "SEND REQUEST ERROR:",
            error
        );


        $("searchResult")
        .innerHTML =
        `
        <div class="card error">
            ${escapeHTML(
                error.message
            )}
        </div>
        `;

    }

}


/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests(){

    if(!currentUser) return;


    const box =
        $("requestsList");


    box.innerHTML =
    `
    <div class="empty">
        Loading requests...
    </div>
    `;


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "friendRequests"
                    ),
                    where(
                        "toUid",
                        "==",
                        currentUser.uid
                    )
                )
            );


        const pending =
            snapshot.docs.filter(
                function(item){

                    return (
                        item.data()
                        .status ===
                        "pending"
                    );

                }
            );


        if(
            pending.length === 0
        ){

            box.innerHTML =
            `
            <div class="empty">
                No pending requests.
            </div>
            `;

            return;

        }


        box.innerHTML = "";


        for(
            const requestDoc
            of pending
        ){

            const request =
                requestDoc.data();


            let sender = {

                email:
                    request.fromEmail,

                name:
                    request.fromEmail
                    .split("@")[0]

            };


            try{

                const senderSnap =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            request.fromUid
                        )
                    );


                if(
                    senderSnap.exists()
                ){

                    sender =
                        senderSnap.data();

                }

            }
            catch(error){

                console.error(
                    error
                );

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML =
            `
            <div class="row">

                <div class="user">

                    <div class="avatar">

                        ${escapeHTML(
                            getUserName(sender)
                            .charAt(0)
                            .toUpperCase()
                        )}

                    </div>

                    <div>

                        <h3>
                            ${escapeHTML(
                                getUserName(sender)
                            )}
                        </h3>

                        <p>
                            ${escapeHTML(
                                sender.email
                            )}
                        </p>

                    </div>

                </div>


                <div>

                    <button
                        type="button"
                        class="smallBtn success acceptBtn">
                        Accept
                    </button>


                    <button
                        type="button"
                        class="smallBtn danger rejectBtn">
                        Reject
                    </button>

                </div>

            </div>
            `;


            card
            .querySelector(
                ".acceptBtn"
            )
            .addEventListener(
                "click",
                function(){

                    respondToRequest(
                        requestDoc.id,
                        request.fromUid,
                        true
                    );

                }
            );


            card
            .querySelector(
                ".rejectBtn"
            )
            .addEventListener(
                "click",
                function(){

                    respondToRequest(
                        requestDoc.id,
                        request.fromUid,
                        false
                    );

                }
            );


            box.appendChild(card);

        }

    }
    catch(error){

        console.error(
            "REQUEST ERROR:",
            error
        );


        box.innerHTML =
        `
        <div class="card error">
            ${escapeHTML(
                error.message
            )}
        </div>
        `;

    }

}


/* =========================
   ACCEPT / REJECT
========================= */

async function respondToRequest(
    requestId,
    senderUid,
    accepted
){

    try{

        await updateDoc(
            doc(
                db,
                "friendRequests",
                requestId
            ),
            {

                status:
                    accepted
                    ? "accepted"
                    : "rejected",

                respondedAt:
                    serverTimestamp()

            }
        );


        if(accepted){

            const friendshipId =
                createChatId(
                    currentUser.uid,
                    senderUid
                );


            await setDoc(
                doc(
                    db,
                    "friends",
                    friendshipId
                ),
                {

                    users:[
                        currentUser.uid,
                        senderUid
                    ],

                    createdAt:
                        serverTimestamp()

                }
            );

        }


        await loadRequests();

        await loadFriends();

        await loadChats();

        await loadHomeStats();

    }
    catch(error){

        console.error(
            "RESPOND ERROR:",
            error
        );


        alert(
            "Could not update request:\n" +
            error.message
        );

    }

}

/* =========================
   OPEN CHAT
========================= */

async function openChat(
    friendUid,
    friend
){

    if(!currentUser) return;


    currentChatFriend = {

        uid:
            friendUid,

        email:
            friend.email,

        name:
            friend.name

    };


    $("chatTitle")
        .textContent =
        getUserName(friend);


    $("chatWindow")
        .style.display =
        "flex";


    $("chatMessages")
        .innerHTML =
        `
        <div class="empty">
            Loading messages...
        </div>
        `;


    if(
        unsubscribeMessages
    ){

        unsubscribeMessages();

        unsubscribeMessages =
            null;

    }


    const chatId =
        createChatId(
            currentUser.uid,
            friendUid
        );


    const messagesRef =
        collection(
            db,
            "chats",
            chatId,
            "messages"
        );


    const messagesQuery =
        query(
            messagesRef,
            orderBy(
                "timestamp",
                "asc"
            )
        );


    unsubscribeMessages =
        onSnapshot(
            messagesQuery,

            function(snapshot){

                const box =
                    $("chatMessages");


                box.innerHTML = "";


                if(
                    snapshot.empty
                ){

                    box.innerHTML =
                    `
                    <div class="empty">
                        No messages yet.<br>
                        Say hello 👋
                    </div>
                    `;

                    return;

                }


                snapshot.forEach(
                    function(messageDoc){

                        const message =
                            messageDoc.data();


                        const bubble =
                            document.createElement(
                                "div"
                            );


                        const mine =
                            message.senderId ===
                            currentUser.uid;


                        bubble.className =
                            "messageBubble " +
                            (
                                mine
                                ? "myMessage"
                                : "otherMessage"
                            );


                        bubble.textContent =
                            message.text || "";


                        box.appendChild(
                            bubble
                        );

                    }
                );


                box.scrollTop =
                    box.scrollHeight;

            },

            function(error){

                console.error(
                    "CHAT LISTENER ERROR:",
                    error
                );


                $("chatMessages")
                    .innerHTML =
                    `
                    <div class="empty error">

                        Unable to load messages.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>
                    `;

            }

        );

}

$("backChatBtn")
.addEventListener(
    "click",
    function(){

        if(
            unsubscribeMessages
        ){

            unsubscribeMessages();

            unsubscribeMessages =
                null;

        }


        currentChatFriend =
            null;


        $("chatWindow")
            .style.display =
            "none";


        $("chatMessages")
            .innerHTML =
            "";

        $("chatInput")
            .value =
            "";

    }
);


/* =========================
   SEND MESSAGE
========================= */

$("sendBtn")
.addEventListener(
    "click",
    sendMessage
);


$("chatInput")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


async function sendMessage(){

    if(
        !currentUser ||
        !currentChatFriend
    ){

        return;

    }


    const input =
        $("chatInput");


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    input.value = "";


    $("sendBtn")
        .disabled =
        true;


    try{

        const chatId =
            createChatId(
                currentUser.uid,
                currentChatFriend.uid
            );


        await addDoc(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            {

                text:
                    text,

                senderId:
                    currentUser.uid,

                senderEmail:
                    currentUser.email,

                timestamp:
                    serverTimestamp()

            }
        );

    }
    catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        alert(
            "Message could not be sent:\n" +
            error.message
        );


        input.value =
            text;

    }
    finally{

        $("sendBtn")
            .disabled =
            false;

    }

}
