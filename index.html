<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ToGeo</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
}

/* ================= LOGIN ================= */

#loginPage {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.loginBox {
  width: 92%;
  max-width: 400px;
  background: white;
  padding: 30px 25px;
  border-radius: 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.logo {
  text-align: center;
  font-size: 36px;
  font-weight: bold;
  color: #1769ff;
}

.subtitle {
  text-align: center;
  color: #777;
  margin: 8px 0 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 18px;
  background: #1769ff;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.loginBtn {
  width: 100%;
  margin-top: 5px;
}

.signupBtn {
  width: 100%;
  margin-top: 10px;
  background: #eaf1ff;
  color: #1769ff;
}

#message {
  text-align: center;
  margin-top: 15px;
  min-height: 20px;
}


/* ================= MAIN ================= */

#mainApp {
  display: none;
  min-height: 100vh;
}

.topbar {
  height: 65px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.topLogo {
  font-size: 25px;
  font-weight: bold;
  color: #1769ff;
}

.logoutBtn {
  background: #ff3b30;
  padding: 9px 15px;
}


/* ================= NAV ================= */

.nav {
  display: flex;
  background: white;
  border-bottom: 1px solid #eee;
  overflow-x: auto;
}

.nav button {
  flex: 1;
  min-width: 90px;
  background: white;
  color: #666;
  border-radius: 0;
}

.nav button.active {
  color: #1769ff;
  border-bottom: 3px solid #1769ff;
}


/* ================= PAGES ================= */

.page {
  display: none;
  padding: 20px;
}

.page.active {
  display: block;
}

.pageTitle {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 20px;
}


/* ================= FRIENDS ================= */

.searchBox {
  display: flex;
  gap: 10px;
}

.searchBox input {
  flex: 1;
  margin: 0;
}

.searchBox button {
  white-space: nowrap;
}

#searchResult {
  margin-top: 15px;
}

.userCard {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.userInfo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #1769ff;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.userName {
  font-weight: bold;
}

.userEmail {
  font-size: 13px;
  color: #777;
}

.sectionTitle {
  margin-top: 25px;
  margin-bottom: 12px;
}


/* ================= CHAT ================= */

.chatPage {
  padding: 0;
  height: calc(100vh - 120px);
}

.chatHeader {
  background: white;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #eee;
}

.backBtn {
  background: #eef3ff;
  color: #1769ff;
  padding: 8px 12px;
}

.chatMessages {
  height: calc(100% - 125px);
  overflow-y: auto;
  padding: 15px;
}

.message {
  max-width: 75%;
  padding: 10px 13px;
  border-radius: 15px;
  margin-bottom: 9px;
  word-wrap: break-word;
}

.message.me {
  margin-left: auto;
  background: #1769ff;
  color: white;
  border-bottom-right-radius: 4px;
}

.message.other {
  background: white;
  color: #222;
  border-bottom-left-radius: 4px;
}

.chatInput {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  padding: 10px;
  display: flex;
  gap: 10px;
  border-top: 1px solid #ddd;
}

.chatInput input {
  margin: 0;
  flex: 1;
}

.chatInput button {
  width: 90px;
}


/* ================= PLACEHOLDERS ================= */

.placeholder {
  background: white;
  padding: 30px;
  border-radius: 18px;
  text-align: center;
  color: #777;
}

</style>

</head>


<body>


<!-- ================================================= -->
<!-- LOGIN -->
<!-- ================================================= -->

<div id="loginPage">

  <div class="loginBox">

    <div class="logo">
      ToGeo
    </div>

    <div class="subtitle">

    </div>

    <input
      id="email"
      type="email"
      placeholder="Email address"
    >

    <input
      id="password"

      placeholder="Password"
    >

    <button
      id="loginBtn"
      class="loginBtn"
    >
      Login
    </button>

    <button
      id="signupBtn"
      class="signupBtn"
    >

    </button>

    <div id="message"></div>

<!-- ================================================= -->
<!-- MAIN APP -->
<!-- ================================================= -->

<div id="mainApp">


  <div class="topbar">

    <div class="topLogo">
      ToGeo
    </div>

    <button
      id="logoutBtn"

    >

    </button>

  </div>


  <!-- NAVIGATION -->

  <div class="nav">

    <button
      class="navBtn active"
      data-page="chatsPage"
    >
      💬 Chats
    </button>

    <button

  <!-- ================================================= -->
  <!-- CHATS -->
  <!-- ================================================= -->

  <div
    id="chatsPage"

  >

    <div class="pageTitle">

    </div>

    <div id="chatList">

      <div class="placeholder">

      </div>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- FRIENDS -->
  <!-- ================================================= -->

  <div
    id="friendsPage"
    class="page"
  >

    <div class="pageTitle">
      Friends
    </div>


    <div class="searchBox">

      <input
        id="friendSearch"
        type="email"
        placeholder="Search by email"
      >

      <button id="searchBtn">
        Search
      </button>

    </div>


    <div id="searchResult"></div>


    <div class="sectionTitle">

    </div>


    <div id="friendsList">

      <div class="placeholder">
        No friends yet.

    </div>

  </div>


  <!-- ================================================= -->
  <!-- TOGETHER -->
  <!-- ================================================= -->

  <div
    id="togetherPage"
    class="page"
  >

    <div class="pageTitle">
      Together
    </div>

    <div class="placeholder">

      🎬 Watch YouTube together<br><br>
      🎵 Listen to music together<br><br>
      ❤️ More features coming

    </div>

  </div>


  <!-- ================================================= -->
  <!-- STATUS -->
  <!-- ================================================= -->

  <div
    id="statusPage"
    class="page"
  >

    <div class="pageTitle">
      Status
    </div>

    <div class="placeholder">

      ⭕ Status feature coming next.

    </div>

  </div>


  <!-- ================================================= -->
  <!-- CHAT SCREEN -->
  <!-- ================================================= -->

  <div
    id="chatScreen"
    class="page chatPage"
  >

    <div class="chatHeader">

      <button
        id="backChat"
        class="backBtn"
      >
        ←
      </button>

      <div>

        <div
          id="chatFriendName"
          class="userName"
        >
          Friend
        </div>

        <div
          id="chatFriendEmail"
          class="userEmail"
        >
        </div>

      </div>

    </div>


    <div
      id="chatMessages"
      class="chatMessages"
    >
    </div>


    <div class="chatInput">

      <input

</div>


<!-- ================================================= -->
<!-- FIREBASE -->
<!-- ================================================= -->

<script type="module">


/* ================= FIREBASE IMPORTS ================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  query,
  where,
  getDocs,
  onSnapshot,
  addDoc,
  serverTimestamp,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCMYx-0G0gCJMhuV-uHZGoYqNQwkQtAUc8",

  authDomain:
    "togeo-8e24c.firebaseapp.com",

  projectId:
    "togeo-8e24c",

  storageBucket:
    "togeo-8e24c.firebasestorage.app",

  messagingSenderId:
    "772918055389",

  appId:
    "1:772918055389:web:14605859a71cf22860e634",

  measurementId:
    "G-DF8JCSHQCH"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ================= VARIABLES ================= */

let currentUser = null;

let currentFriend = null;

let stopMessagesListener = null;

let stopFriendsListener = null;


/* ================= HTML ================= */

const loginPage =
  document.getElementById("loginPage");

const mainApp =
  document.getElementById("mainApp");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const signupBtn =
  document.getElementById("signupBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const message =
  document.getElementById("message");

const friendSearch =
  document.getElementById("friendSearch");

const searchBtn =
  document.getElementById("searchBtn");

const searchResult =
  document.getElementById("searchResult");

const friendsList =
  document.getElementById("friendsList");

const chatScreen =
  document.getElementById("chatScreen");

const chatMessages =
  document.getElementById("chatMessages");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const backChat =
  document.getElementById("backChat");

const chatFriendName =
  document.getElementById("chatFriendName");

const chatFriendEmail =
  document.getElementById("chatFriendEmail");

const chatList =
  document.getElementById("chatList");


/* ================= MESSAGE ================= */

function showMessage(
  text,
  success = false
) {

  message.textContent = text;

  message.style.color =
    success ? "green" : "red";
}


/* ================= FRIEND ID ================= */

function makeFriendId(
  uid1,
  uid2
) {

  return [uid1, uid2]
    .sort()
    .join("_");
}


/* ================= CHAT ID ================= */

function makeChatId(
  uid1,
  uid2
) {

  return [uid1, uid2]
    .sort()
    .join("_");
}


/* ================= GET INITIAL ================= */

function getInitial(
  email
) {

  if (!email) {
    return "?";
  }

  return email
    .charAt(0)
    .toUpperCase();
}


/* ================================================= */
/* CREATE ACCOUNT */
/* ================================================= */

signupBtn.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!email || !password) {

      showMessage(
        "Enter email and password."
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "Password must be at least 6 characters."
      );

      return;
    }


    try {

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      await setDoc(
        doc(
          db,
          "users",
          result.user.uid
        ),
        {
          uid: result.user.uid,
          email: email,
          name: email.split("@")[0],
          createdAt: serverTimestamp()
        }
      );


      showMessage(
        "Account created successfully!",
        true
      );


    } catch (error) {

      console.error(
        "SIGNUP:",
        error
      );

      showMessage(
        error.code +
        " : " +
        error.message
      );

    }

  }
);


/* ================================================= */
/* LOGIN */
/* ================================================= */

loginBtn.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!email || !password) {

      showMessage(
        "Enter email and password."
      );

      return;
    }


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      showMessage(
        "Login successful!",
        true
      );


    } catch (error) {

      console.error(
        "LOGIN:",
        error
      );

      showMessage(
        error.code +
        " : " +
        error.message
      );

    }

  }
);


/* ================================================= */
/* AUTH STATE */
/* ================================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      currentUser = user;

      loginPage.style.display =
        "none";

      mainApp.style.display =
        "block";


      /* Ensure user profile exists */

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );

      const userSnap =
        await getDoc(userRef);


      if (!userSnap.exists()) {

        await setDoc(
          userRef,
          {
            uid: user.uid,
            email: user.email,
            name: user.email.split("@")[0],
            createdAt: serverTimestamp()
          }
        );

      }


      loadFriends();

    } else {

      currentUser = null;

      loginPage.style.display =
        "flex";

      mainApp.style.display =
        "none";

    }

  }
);


/* ================================================= */
/* LOGOUT */
/* ================================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);


/* ================================================= */
/* NAVIGATION */
/* ================================================= */

document
  .querySelectorAll(".navBtn")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const pageId =
            button.dataset.page;


          document
            .querySelectorAll(".navBtn")
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          document
            .querySelectorAll(".page")
            .forEach(
              page => {

                if (
                  page.id === pageId
                ) {

                  page.classList.add(
                    "active"
                  );

                } else {

                  page.classList.remove(
                    "active"
                  );

                }

              }
            );

        }
      );

    }
  );


/* ================================================= */
/* SEARCH USER */
/* ================================================= */

searchBtn.addEventListener(
  "click",
  async () => {

    const email =
      friendSearch.value
        .trim()
        .toLowerCase();


    if (!email) {

      searchResult.innerHTML =
        "<p>Enter an email address.</p>";

      return;
    }


    if (
      currentUser &&
      email === currentUser.email.toLowerCase()
    ) {

      searchResult.innerHTML =
        "<p>You cannot add yourself.</p>";

      return;
    }


    try {

      const usersRef =
        collection(
          db,
          "users"
        );


      const q =
        query(
          usersRef,
          where(
            "email",
            "==",
            email
          )
        );


      const snapshot =
        await getDocs(q);


      if (snapshot.empty) {

        searchResult.innerHTML =
          "<div class='placeholder'>User not found.</div>";

        return;
      }


      const userDoc =
        snapshot.docs[0];

      const user =
        userDoc.data();


      searchResult.innerHTML = `

        <div class="userCard">

          <div class="userInfo">

            <div class="avatar">
              ${getInitial(user.email)}
            </div>

            <div>

              <div class="userName">
                ${user.name || "User"}
              </div>

              <div class="userEmail">
                ${user.email}
              </div>

            </div>

          </div>

          <button
            id="addFriendBtn"
          >
            Add
          </button>

        </div>

      `;


      document
        .getElementById(
          "addFriendBtn"
        )
        .addEventListener(
          "click",
          () => addFriend(user)
        );


    } catch (error) {

      console.error(
        "SEARCH:",
        error
      );

      searchResult.innerHTML =
        "<p>Search failed. Check Firestore rules.</p>";

    }

  }
);


/* ================================================= */
/* ADD FRIEND */
/* ================================================= */

async function addFriend(
  friend
) {

  if (!currentUser) {
    return;
  }


  const friendId =
    makeFriendId(
      currentUser.uid,
      friend.uid
    );


  try {

    await setDoc(
      doc(
        db,
        "friends",
        friendId
      ),
      {
        user1:
          currentUser.uid,

        user2:
          friend.uid,

        createdAt:
          serverTimestamp()
      }
    );


    /* Save copy for current user */

    await setDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "myFriends",
        friend.uid
      ),
      {
        uid:
          friend.uid,

        email:
          friend.email,

        name:
          friend.name || "User"
      }
    );


    /* Save copy for friend */

    await setDoc(
      doc(
        db,
        "users",
        friend.uid,
        "myFriends",
        currentUser.uid
      ),
      {
        uid:
          currentUser.uid,

        email:
          currentUser.email,

        name:
          currentUser.email.split("@")[0]
      }
    );


    searchResult.innerHTML =
      "<div class='placeholder'>Friend added successfully! 🎉</div>";


  } catch (error) {

    console.error(
      "ADD FRIEND:",
      error
    );

    searchResult.innerHTML =
      "<p>Could not add friend.</p>";

  }

}


/* ================================================= */
/* LOAD FRIENDS */
/* ================================================= */

function loadFriends() {

  if (!currentUser) {
    return;
  }


  if (stopFriendsListener) {

    stopFriendsListener();

  }


  const friendsRef =
    collection(
      db,
      "users",
      currentUser.uid,
      "myFriends"
    );


  stopFriendsListener =
    onSnapshot(
      friendsRef,
      snapshot =>
