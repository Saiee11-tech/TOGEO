<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Clone</title>
    <!-- Socket.io Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #dadbd4; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Login Screen Overlay */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #00a884; display: flex; justify-content: center; align-items: center; z-index: 10;
        }
        .login-box { background: white; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        .login-box input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .login-box button { background: #00a884; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }

        /* Main App Layout */
        .app-container { display: flex; width: 90vw; height: 90vh; background: #f0f2f5; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 3px; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 30%; background: white; border-right: 1px solid #e2e2e2; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #f0f2f5; font-weight: bold; border-bottom: 1px solid #ddd; }
        .user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .user-item { padding: 10px; border-bottom: 1px solid #f0f2f5; font-size: 14px; color: #333; }

        /* Chat Area */
        .chat-area { width: 70%; display: flex; flex-direction: column; background: #efeae2; }
        .chat-header { padding: 15px; background: #f0f2f5; font-weight: bold; border-bottom: 1px solid #ddd; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Message Bubbles */
        .message { max-width: 60%; padding: 8px 12px; border-radius: 7.5px; position: relative; font-size: 14px; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .message.incoming { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .message.outgoing { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .message .meta { font-size: 10px; color: #999; text-align: right; margin-top: 4px; }
        
        /* Chat Input */
        .chat-input-area { padding: 10px 20px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 10px 15px; border: none; border-radius: 8px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #00a884; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Login Prompt -->
    <div id="login-screen">
        <div class="login-box">
            <h2>WhatsApp Clone</h2>
            <p style="color: #666; font-size: 13px; margin-top: 5px;">Enter your name to start chatting</p>
            <input type="text" id="username-input" placeholder="Your Name..." autocomplete="off">
            <button onclick="login()">Join Chat</button>
        </div>
    </div>

    <!-- Main Chat Container -->
    <div class="app-container" id="app-container" style="display: none;">
        <!-- Sidebar showing active participants -->
        <div class="sidebar">
            <div class="sidebar-header" id="current-user-label">Chats</div>
            <div class="user-list" id="user-list">
                <!-- Dynamically populated active users -->
            </div>
        </div>

        <!-- Conversation window -->
        <div class="chat-area">
            <div class="chat-header">Global Community Chat Room</div>
            <div class="chat-messages" id="chat-messages">
                <!-- Dynamically populated messages -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let currentUser = '';

        function login() {
            const input = document.getElementById('username-input').value.trim();
            if (!input) {
                alert('Please enter a valid username');
                return;
            }
            currentUser = input;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('current-user-label').innerText = `Logged in as: ${currentUser}`;

            // Initialize Socket connection to backend server
            socket = io('http://localhost:3000');

            socket.emit('join', currentUser);

            // Listen for incoming messages
            socket.on('receive_message', (data) => {
                appendMessage(data);
            });

            // Listen for updates to active user list
            socket.on('update_users', (users) => {
                const userListEl = document.getElementById('user-list');
                userListEl.innerHTML = '<p style="font-size:12px; color:#666; margin-bottom:8px;">Active Users:</p>';
                users.forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'user-item';
                    div.innerText = `🟢 ${user}`;
                    userListEl.appendChild(div);
                });
            });
        }

        function sendMessage() {
            const inputEl = document.getElementById('message-input');
            const message = inputEl.value.trim();
            if (!message) return;

            socket.emit('send_message', {
                sender: currentUser,
                message: message
            });

            inputEl.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function appendMessage(data) {
            const messagesContainer = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            
            const isOutgoing = data.sender === currentUser;
            messageDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
            
            messageDiv.innerHTML = `
                ${!isOutgoing ? `<div style="font-size:11px; font-weight:bold; color:#00a884; margin-bottom:2px;">${data.sender}</div>` : ''}
                <div>${escapeHtml(data.message)}</div>
                <div class="meta">${data.timestamp}</div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight; // Auto scroll to bottom
        }

        // Simple security utility to prevent script injection via chat
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
