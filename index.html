<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ToGeo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eef3f8;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      color: #1769ff;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;

      border: 1px solid #d9dfe7;
      border-radius: 12px;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1769ff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;

      border: none;
      border-radius: 12px;

      background: #1769ff;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .signup {
      background: #eaf1ff;
      color: #1769ff;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      min-height: 20px;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ToGeo
    </div>

    <div class="subtitle">
      Connect with everyone
    </div>

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      Login
    </button>

    <button
      id="signupBtn"
      class="signup"
    >
      Create Account
    </button>

    <div id="message"></div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCMYx-0G0gCJMhuV-uHZGoYqNQwkQtAUc8",

      authDomain:
        "togeo-8e24c.firebaseapp.com",

      projectId:
        "togeo-8e24c",

      storageBucket:
        "togeo-8e24c.firebasestorage.app",

      messagingSenderId:
        "772918055389",

      appId:
        "1:772918055389:web:14605859a71cf22860e634",

      measurementId:
        "G-DF8JCSHQCH"
    };


    // =========================
    // INITIALIZE FIREBASE
    // =========================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    // =========================
    // HTML ELEMENTS
    // =========================

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    // =========================
    // MESSAGE FUNCTION
    // =========================

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      if (type === "success") {

        message.style.color = "green";

      } else if (type === "info") {

        message.style.color = "#1769ff";

      } else {

        message.style.color = "red";
      }
    }


    // =========================
    // VALIDATE INPUT
    // =========================

    function getInput() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email) {

        showMessage(
          "Please enter your email."
        );

        return null;
      }

      if (!password) {

        showMessage(
          "Please enter your password."
        );

        return null;
      }

      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters."
        );

        return null;
      }

      return {
        email,
        password
      };
    }


    // =========================
    // CREATE ACCOUNT
    // =========================

    signupBtn.addEventListener(
      "click",
      async function () {

        const data =
          getInput();

        if (!data) {
          return;
        }

        signupBtn.classList.add("loading");

        loginBtn.classList.add("loading");

        showMessage(
          "Creating account...",
          "info"
        );


        try {

          await createUserWithEmailAndPassword(
            auth,
            data.email,
            data.password
          );

          showMessage(
            "Account created successfully! 🎉",
            "success"
          );

        } catch (error) {

          console.error(
            "SIGNUP ERROR:",
            error
          );


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            showMessage(
              "This email is already registered. Please login."
            );

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            showMessage(
              "Please enter a valid email address."
            );

          }

          else if (
            error.code ===
            "auth/weak-password"
          ) {

            showMessage(
              "Password must contain at least 6 characters."
            );

          }

          else if (
            error.code ===
            "auth/operation-not-allowed"
          ) {

            showMessage(
              "Email/Password authentication is not enabled in Firebase."
            );

          }

          else {

            showMessage(
              error.code +
              " : " +
              error.message
            );
          }

        }

        finally {

          signupBtn.classList.remove(
            "loading"
          );

          loginBtn.classList.remove(
            "loading"
          );
        }

      }
    );


    // =========================
    // LOGIN
    // =========================

    loginBtn.addEventListener(
      "click",
      async function () {

        const data =
          getInput();

        if (!data) {
          return;
        }

        signupBtn.classList.add("loading");

        loginBtn.classList.add("loading");

        showMessage(
          "Logging in...",
          "info"
        );


        try {

          await signInWithEmailAndPassword(
            auth,
            data.email,
            data.password
          );

          showMessage(
            "Login successful! 🎉",
            "success"
          );

        } catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            showMessage(
              "Invalid email or password."
            );

          }

          else if (
            error.code ===
            "auth/user-not-found"
          ) {

            showMessage(
              "Account not found. Please create an account first."
            );

          }

          else if (
            error.code ===
            "auth/wrong-password"
          ) {

            showMessage(
              "Incorrect password."
            );

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            showMessage(
              "Please enter a valid email."
            );

          }

          else {

            showMessage(
              error.code +
              " : " +
              error.message
            );
          }

        }

        finally {

          signupBtn.classList.remove(
            "loading"
          );

          loginBtn.classList.remove(
            "loading"
          );
        }

      }
    );


    // =========================
    // AUTH STATE
    // =========================

    onAuthStateChanged(
      auth,
      function (user) {

        if (user) {

          console.log(
            "Firebase user:",
            user.email
          );

        } else {

          console.log(
            "No user logged in."
          );
        }

      }
    );


    // =========================
    // FIREBASE READY
    // =========================

    console.log(
      "ToGeo Firebase initialized successfully."
    );

  </script>

</body>
</html>
