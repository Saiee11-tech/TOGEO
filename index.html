<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToGeo Test</title>
</head>

<body style="padding:30px;font-family:Arial">

<h1 style="color:#1769ff">ToGeo</h1>

<input id="email" type="email" placeholder="Email"
style="display:block;width:100%;padding:15px;margin:10px 0">

<input id="password" type="password" placeholder="Password"
style="display:block;width:100%;padding:15px;margin:10px 0">

<button id="loginBtn"
style="padding:15px;width:100%;background:#1769ff;color:white;border:0">
Login
</button>

<button id="signupBtn"
style="padding:15px;width:100%;margin-top:10px">
Create Account
</button>

<p id="message"></p>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyCMYx-0G0gCJMhuV-uHZGoYqNQwkQtAUc8",

  authDomain: "togeo-8e24c.firebaseapp.com",

  projectId: "togeo-8e24c",

  storageBucket: "togeo-8e24c.firebasestorage.app",

  messagingSenderId: "772918055389",

  appId: "1:772918055389:web:14605859a71cf22860e634",

  measurementId: "G-DF8JCSHQCH"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const message =
document.getElementById("message");


document
.getElementById("signupBtn")
.addEventListener("click", async () => {

  message.textContent = "Creating account...";

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;


  try {

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    message.textContent =
      "Account created successfully!";

  }

  catch(error) {

    message.textContent =
      error.code + " : " + error.message;

  }

});


document
.getElementById("loginBtn")
.addEventListener("click", async () => {

  message.textContent = "Logging in...";

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;


  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    message.textContent =
      "LOGIN SUCCESSFUL ✅";

  }

  catch(error) {

    message.textContent =
      error.code + " : " + error.message;

  }

});

</script>

</body>
</html>
