<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ToGeo</title>


<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f4f7fb;

    color:#111827;

    min-height:100vh;
}


/* ================= COMMON ================= */

button{
    border:none;
    cursor:pointer;
    font-family:inherit;
}

input{
    font-family:inherit;
}


/* ================= LOGIN PAGE ================= */

#loginPage{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f8fafc
        );
}


.loginBox{

    width:100%;
    max-width:420px;

    background:white;

    padding:35px;

    border-radius:20px;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.10);

    text-align:center;
}


.logo{

    font-size:42px;

    font-weight:800;

    color:#2563eb;

    margin-bottom:5px;
}


.tagline{

    color:#64748b;

    margin-bottom:28px;

    font-size:14px;
}


.inputGroup{

    text-align:left;

    margin-bottom:16px;
}


.inputGroup label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:600;

    color:#374151;
}


.inputGroup input{

    width:100%;

    padding:13px 14px;

    border:
        1px solid #d1d5db;

    border-radius:10px;

    outline:none;

    font-size:15px;
}


.inputGroup input:focus{

    border-color:#2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,0.10);
}


.authButtons{

    display:flex;

    gap:10px;

    margin-top:20px;
}


.authButtons button{

    flex:1;

    padding:13px;

    border-radius:10px;

    font-size:15px;

    font-weight:700;
}


#loginBtn{

    background:#2563eb;

    color:white;
}


#signupBtn{

    background:#e5e7eb;

    color:#111827;
}


.authButtons button:disabled{

    opacity:.6;

    cursor:not-allowed;
}


#message{

    min-height:22px;

    margin-top:18px;

    font-size:14px;

    font-weight:600;
}


/* ================= MAIN APP ================= */

#mainApp{

    min-height:100vh;

    background:#f8fafc;
}


.hidden{

    display:none !important;
}


/* ================= TOP BAR ================= */

.topBar{

    height:65px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 20px;

    border-bottom:
        1px solid #e5e7eb;

    position:sticky;

    top:0;

    z-index:100;
}


.topLogo{

    font-size:26px;

    font-weight:800;

    color:#2563eb;
}


#logoutBtn{

    padding:
        9px 15px;

    border-radius:9px;

    background:#fee2e2;

    color:#b91c1c;

    font-weight:700;
}


/* ================= NAVIGATION ================= */

.navBar{

    background:white;

    border-bottom:
        1px solid #e5e7eb;

    display:flex;

    justify-content:center;

    gap:8px;

    padding:10px;

    position:sticky;

    top:65px;

    z-index:90;
}


.navBar button{

    padding:
        10px 18px;

    border-radius:9px;

    background:transparent;

    color:#475569;

    font-weight:600;
}


.navBar button:hover{

    background:#eff6ff;

    color:#2563eb;
}


/* ================= CONTENT ================= */

.content{

    width:100%;

    max-width:1100px;

    margin:auto;

    padding:25px 20px;
}


.section{

    display:none;
}


.section.active{

    display:block;
}


/* ================= HOME ================= */

.homeCard{

    background:white;

    border-radius:18px;

    padding:30px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.06);

    margin-bottom:20px;
}


.homeCard h1{

    margin-bottom:10px;

    font-size:28px;
}


#welcomeText{

    color:#64748b;

    margin-bottom:25px;
}


.stats{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}


.statCard{

    padding:20px;

    border-radius:14px;

    background:#f8fafc;

    border:
        1px solid #e5e7eb;
}


.statCard h3{

    color:#64748b;

    font-size:14px;

    margin-bottom:8px;
}


.statCard p{

    font-size:28px;

    font-weight:800;

    color:#2563eb;
}


/* ================= SECTION HEADER ================= */

.sectionHeader{

    margin-bottom:20px;
}


.sectionHeader h2{

    font-size:25px;

    margin-bottom:5px;
}


.sectionHeader p{

    color:#64748b;

    font-size:14px;
}


/* ================= SEARCH ================= */

.searchBox{

    display:flex;

    gap:10px;

    margin-bottom:20px;
}


.searchBox input{

    flex:1;

    padding:13px 14px;

    border:
        1px solid #d1d5db;

    border-radius:10px;

    outline:none;

    font-size:15px;
}


.searchBox input:focus{

    border-color:#2563eb;
}


.searchBox button{

    padding:
        0 20px;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-weight:700;
}


/* ================= CARD ================= */

.card{

    background:white;

    padding:18px;

    border-radius:14px;

    border:
        1px solid #e5e7eb;

    margin-bottom:12px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.04);
}


.cardRow{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}


.userInfo{

    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;
}


.avatar{

    width:45px;

    height:45px;

    border-radius:50%;

    background:#dbeafe;

    color:#2563eb;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:800;

    flex-shrink:0;
}


.userText{

    min-width:0;
}


.userText h3{

    font-size:16px;

    margin-bottom:4px;
}


.userText p{

    font-size:13px;

    color:#64748b;

    overflow:hidden;

    text-overflow:ellipsis;
}


.primaryBtn{

    padding:
        9px 14px;

    border-radius:8px;

    background:#2563eb;

    color:white;

    font-weight:700;

    white-space:nowrap;
}


.successBtn{

    padding:
        9px 14px;

    border-radius:8px;

    background:#dcfce7;

    color:#166534;

    font-weight:700;
}


.dangerBtn{

    padding:
        9px 14px;

    border-radius:8px;

    background:#fee2e2;

    color:#b91c1c;

    font-weight:700;
}


.empty{

    text-align:center;

    padding:40px 20px;

    color:#94a3b8;
}


/* ================= CHAT ================= */

#chatWindow{

    position:fixed;

    inset:0;

    background:#f8fafc;

    z-index:200;

    display:none;

    flex-direction:column;
}


.chatHeader{

    height:65px;

    background:white;

    border-bottom:
        1px solid #e5e7eb;

    display:flex;

    align-items:center;

    gap:15px;

    padding:
        0 18px;
}


#backChatBtn{

    background:#f1f5f9;

    width:40px;

    height:40px;

    border-radius:50%;

    font-size:20px;
}


#chatTitle{

    font-size:18px;

    font-weight:700;
}


#chatMessages{

    flex:1;

    overflow-y:auto;

    padding:20px;

    display:flex;

    flex-direction:column;

    gap:10px;
}


.message{

    max-width:75%;

    padding:
        10px 13px;

    border-radius:14px;

    font-size:14px;

    line-height:1.4;
}


.myMessage{

    align-self:flex-end;

    background:#2563eb;

    color:white;

    border-bottom-right-radius:4px;
}


.otherMessage{

    align-self:flex-start;

    background:white;

    color:#111827;

    border:
        1px solid #e5e7eb;

    border-bottom-left-radius:4px;
}


.chatInputArea{

    background:white;

    padding:12px;

    display:flex;

    gap:10px;

    border-top:
        1px solid #e5e7eb;
}


#chatInput{

    flex:1;

    padding:12px 14px;

    border:
        1px solid #d1d5db;

    border-radius:10px;

    outline:none;
}


#sendBtn{

    padding:
        0 20px;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-weight:700;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .loginBox{

        padding:25px 20px;
    }


    .navBar{

        overflow-x:auto;

        justify-content:flex-start;
    }


    .navBar button{

        white-space:nowrap;
    }


    .content{

        padding:
            18px 12px;
    }


    .stats{

        grid-template-columns:1fr;
    }


    .cardRow{

        align-items:flex-start;
    }


    .primaryBtn,
    .successBtn,
    .dangerBtn{

        padding:
            8px 10px;

        font-size:12px;
    }


    .searchBox{

        flex-direction:column;
    }


    .searchBox button{

        padding:12px;
    }

}

</style>

</head>

<body>

<!-- ================= MAIN APP ================= -->

<div

>

    <div class="topBar">

<!-- ================= CHAT WINDOW ================= -->

<div id="chatWindow">


    <div class="chatHeader">

        >

        <button id="sendBtn">
            Send
        </button>

    </div>

</div>
<!-- ================= FIREBASE CODE ================= -->

<script type="module">


/* ================= FIREBASE ================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    setDoc,
    getDoc,
    onSnapshot,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";



/* ================= CONFIG ================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCMYx-0G0gCJMhuV-uHZGoYqNQwkQtAUc8",

    authDomain:
        "togeo-8e24c.firebaseapp.com",

    projectId:
        "togeo-8e24c",

    storageBucket:
        "togeo-8e24c.firebasestorage.app",

    messagingSenderId:
        "772918055389",

    appId:
        "1:772918055389:web:14605859a71cf22860e634",

    measurementId:
        "G-DF8JCSHQCH"

};



/* ================= INITIALIZE ================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);



/* ================= GLOBAL ================= */

window.toGeoDB =
    db;

window.toGeoAuth =
    auth;

window.toGeoUser =
    null;

let currentUser =
    null;



/* ================= ELEMENTS ================= */

const loginPage =
    document.getElementById("loginPage");

const mainApp =
    document.getElementById("mainApp");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const signupBtn =
    document.getElementById("signupBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const message =
    document.getElementById("message");

const welcomeText =
    document.getElementById("welcomeText");



/* ================= MESSAGE ================= */

function showMessage(
    text,
    success = false
){

    message.textContent =
        text;

    message.style.color =
        success
        ? "#16a34a"
        : "#dc2626";

}



/* ================= SIGN UP ================= */

signupBtn.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        if(!email){

            showMessage(
                "Please enter your email."
            );

            return;
        }


        if(!password){

            showMessage(
                "Please enter your password."
            );

            return;
        }


        if(password.length < 6){

            showMessage(
                "Password must be at least 6 characters."
            );

            return;
        }


        loginBtn.disabled =
            true;

        signupBtn.disabled =
            true;


        showMessage(
            "Creating account...",
            true
        );


        try{

            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            await setDoc(
                doc(
                    db,
                    "users",
                    user.uid
                ),
                {

                    uid:
                        user.uid,

                    email:
                        user.email,

                    name:
                        user.email
                            .split("@")[0],

                    createdAt:
                        serverTimestamp()

                }
            );


            currentUser =
                user;

            window.toGeoUser =
                user;


            loginPage.style.display =
                "none";

            mainApp.classList.remove(
                "hidden"
            );


            welcomeText.textContent =
                "Welcome, " +
                user.email;


            showMessage(
                "Account created successfully!",
                true
            );


        }
        catch(error){

            console.error(
                "SIGNUP ERROR:",
                error
            );


            showMessage(
                error.code +
                " : " +
                error.message
            );

        }
        finally{

            loginBtn.disabled =
                false;

            signupBtn.disabled =
                false;

        }

    }
);



/* ================= LOGIN ================= */

loginBtn.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        if(!email){

            showMessage(
                "Please enter your email."
            );

            return;
        }


        if(!password){

            showMessage(
                "Please enter your password."
            );

            return;
        }


        loginBtn.disabled =
            true;

        signupBtn.disabled =
            true;


        showMessage(
            "Logging in...",
            true
        );


        try{

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            currentUser =
                user;

            window.toGeoUser =
                user;


            loginPage.style.display =
                "none";

            mainApp.classList.remove(
                "hidden"
            );


            welcomeText.textContent =
                "Logged in as: " +
                user.email;


            showMessage(
                "Login successful!",
                true
            );


            console.log(
                "LOGIN SUCCESS",
                user.email
            );

        }
        catch(error){

            console.error(
                "LOGIN ERROR",
                error
            );


            showMessage(
                error.code +
                " : " +
                error.message
            );

        }
        finally{

            loginBtn.disabled =
                false;

            signupBtn.disabled =
                false;

        }

    }
);



/* ================= AUTH STATE ================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(user){

            currentUser =
                user;

            window.toGeoUser =
                user;


            loginPage.style.display =
                "none";

            mainApp.classList.remove(
                "hidden"
            );


            welcomeText.textContent =
                "Logged in as: " +
                user.email;


            try{

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userSnap =
                    await getDoc(
                        userRef
                    );


                if(!userSnap.exists()){

                    await setDoc(
                        userRef,
                        {

                            uid:
                                user.uid,

                            email:
                                user.email,

                            name:
                                user.email
                                    .split("@")[0],

                            createdAt:
                                serverTimestamp()

                        }
                    );

                }

            }
            catch(error){

                console.error(
                    "PROFILE ERROR:",
                    error
                );

            }

        }
        else{

            currentUser =
                null;

            window.toGeoUser =
                null;


            loginPage.style.display =
                "flex";

            mainApp.classList.add(
                "hidden"
            );

        }

    }
);



/* ================= LOGOUT ================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        try{

            await signOut(auth);

        }
        catch(error){

            console.error(
                "LOGOUT ERROR:",
                error
            );

        }

    }
);



/* ================= ENTER LOGIN ================= */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            loginBtn.click();

        }

    }
);



console.log(
    "🔥 ToGeo Firebase Ready"
);



/* ==================================================
   PART 4 FUNCTIONS WILL CONTINUE BELOW
   ================================================== */
/* ================= NAVIGATION ================= */

function showSection(sectionName){

    const sections =
        document.querySelectorAll(
            ".section"
        );


    sections.forEach(
        function(section){

            section.classList.remove(
                "active"
            );

        }
    );


    const target =
        document.getElementById(
            sectionName + "Section"
        );


    if(target){

        target.classList.add(
            "active"
        );

    }


    if(sectionName === "home"){

        loadHomeStats();

    }


    if(sectionName === "friends"){

        loadFriends();

    }


    if(sectionName === "requests"){

        loadRequests();

    }


    if(sectionName === "chats"){

        loadChats();

    }

}



/* ================= NAV BUTTONS ================= */

document
    .getElementById("navHome")
    .addEventListener(
        "click",
        function(){

            showSection("home");

        }
    );


document
    .getElementById("navChats")
    .addEventListener(
        "click",
        function(){

            showSection("chats");

        }
    );


document
    .getElementById("navFriends")
    .addEventListener(
        "click",
        function(){

            showSection("friends");

        }
    );


document
    .getElementById("navRequests")
    .addEventListener(
        "click",
        function(){

            showSection("requests");

        }
    );



/* ================= HOME STATS ================= */

async function loadHomeStats(){

    const user =
        window.toGeoUser;

    const database =
        window.toGeoDB;


    if(!user){

        return;

    }


    try{

        const friendsQuery =
            query(

async function searchUser(){

    const user =
        window.toGeoUser;

    const database =
        window.toGeoDB;


    const input =
        document.getElementById(
            "searchInput"
        );


    const resultBox =
        document.getElementById(
            "searchResult"
        );


    const email =
        input.value
            .trim()
            .toLowerCase();


    if(!user){

        return;

    }


    if(!email){

        resultBox.innerHTML =
            `
            <div class="card">
                Please enter an email.
            </div>
            `;

        return;

    }


    if(email === user.email.toLowerCase()){

        resultBox.innerHTML =
            `
            <div class="card">
                You cannot add yourself.
            </div>
            `;

        return;

    }


    resultBox.innerHTML =
        `
        <div class="card">
            Searching...
        </div>
        `;


    try{

        const usersQuery =
            query(
                collection(
                    database,
                    "users"
                ),
                where(
                    "email",
                    "==",
                    email
                )
            );


        const snapshot =
            await getDocs(
                usersQuery
            );


        if(snapshot.empty){

            resultBox.innerHTML =
                `
                <div class="card empty">
                    User not found.
                </div>
                `;

            return;

        }


        const userDoc =
            snapshot.docs[0];

        const foundUser =
            userDoc.data();


        resultBox.innerHTML =
            `
            <div class="card">

                <div class="cardRow">

                    <div class="userInfo">

                        <div class="avatar">
                            ${foundUser.name
                                ? foundUser.name
                                    .charAt(0)
                                    .toUpperCase()
                                : "U"}
                        </div>

                        <div class="userText">

                            <h3>
                                ${foundUser.name || "User"}
                            </h3>

                            <p>
                                ${foundUser.email}
                            </p>

                        </div>

                    </div>


                    <button
                        class="primaryBtn"
                        id="addFriendBtn"
                    >
                        Add Friend
                    </button>

                </div>

            </div>
            `;


        document
            .getElementById("addFriendBtn")
            .addEventListener(
                "click",
                function(){

                    sendFriendRequest(
                        userDoc.id,
                        foundUser.email
                    );

                }
            );

    }
    catch(error){

        console.error(
            "SEARCH ERROR:",
            error
        );


        resultBox.innerHTML =
            `
            <div class="card">
                Search error:
                ${error.message}
            </div>
            `;

    }

}



/* ================= FRIEND REQUEST ================= */

async function sendFriendRequest(
    toUid,
    toEmail
){

    const user =
        window.toGeoUser;

    const database =
        window.toGeoDB;


    if(!user){

        return;

    }


    try{

        /* CHECK EXISTING REQUEST */

        const existingQuery =
            query(
                collection(
                    database,
                    "friendRequests"
                ),
                where(
                    "fromUid",
                    "==",
                    user.uid
                ),
                where(
                    "toUid",
                    "==",
                    toUid
                )
            );


        const existingSnapshot =
            await getDocs(
                existingQuery
            );


        if(!existingSnapshot.empty){

            alert(
                "Friend request already sent."
            );

            return;

        }


        await addDoc(
            collection(
                database,
                "friendRequests"
            ),
            {

                fromUid:
                    user.uid,

                fromEmail:
                    user.email,

                toUid:
                    toUid,

                toEmail:
                    toEmail,

                status:
                    "pending",

                createdAt:
                    serverTimestamp()

            }
        );


        alert(
            "Friend request sent successfully!"
        );


        document.getElementById(
            "searchResult"
        ).innerHTML =
            `
            <div class="card">
                Friend request sent to
                <b>${toEmail}</b>.
            </div>
            `;


        loadHomeStats();

    }
    catch(error){

        console.error(
            "FRIEND REQUEST ERROR:",
            error
        );


        alert(
            "Error: " +
            error.message
        );

    }

}



/* ================= LOAD REQUESTS ================= */

async function loadRequests(){

    const user =
        window.toGeoUser;

    const database =
        window.toGeoDB;


    const container =
        document.getElementById(
            "requestsList"
        );


    if(!user){

        return;

    }


    container.innerHTML =
        `
        <div class="empty">
            Loading...
        </div>
        `;


    try{

        const requestsQuery =
            query(
                collection(
                    database,
                    "friendRequests"
                ),
                where(
                    "toUid",
                    "==",
                    user.uid
                ),
                where(
                    "status",
                    "==",
                    "pending"
                )
            );


        const snapshot =
            await getDocs(
                requestsQuery
            );


        if(snapshot.empty){

            container.innerHTML =
                `
                <div class="empty">
                    No pending requests.
                </div>
                `;

            loadHomeStats();

            return;

        }


        container.innerHTML =
            "";


        snapshot.forEach(
            function(requestDoc){

                const request =
                    requestDoc.data();


                const firstLetter =
                    request.fromEmail
                        .charAt(0)
                        .toUpperCase();


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "card";


                card.innerHTML =
                    `
                    <div class="cardRow">

                        <div class="userInfo">

                            <div class="avatar">
                                ${firstLetter}
                            </div>

                            <div class="userText">

                                <h3>
                                    Friend Request
                                </h3>

                                <p>
                                    ${request.fromEmail}
                                </p>

                            </div>

                        </div>


                        <div
                            style="
                                display:flex;
                                gap:8px;
                            "
                        >

                            <button
                                class="successBtn"
                                data-accept
                            >
                                Accept
                            </button>

                            <button
                                class="dangerBtn"
                                data-reject
                            >
                                Reject
                            </button>

                        </div>

                    </div>
                    `;


                card
                    .querySelector(
                        "[data-accept]"
                    )
                    .addEventListener(
                        "click",
                        function(){

                            acceptRequest(
                                requestDoc.id,
                                request
                            );

                        }
                    );


                card
                    .querySelector(
                        "[data-reject]"
                    )
                    .addEventListener(
                        "click",
                        function(){

                            rejectRequest(
                                requestDoc.id
                            );

                        }
                    );


                container.appendChild(
                    card
                );

            }
        );


        loadHomeStats();

    }
    catch(error){

        console.error(
            "LOAD REQUESTS ERROR:",
            error
        );


        container.innerHTML =
            `
            <div class="card">
                ${error.message}
            </div>
            `;

    }

}



/* ================= ACCEPT REQUEST ================= */

async function acceptRequest(
    requestId,
    request
){

    const user =
        window.toGeoUser;

    const database =
        window.toGeoDB;


    try{

        await updateDoc(
            doc(
                database,
                "friendRequests",
                requestId
            ),
            {
                status:
                    "accepted"
            }
        );


        const chatId =
            [user.uid, request.fromUid]
                .sort()
                .join("_");


        await setDoc(
            doc(
                database,
                "friends",
                chatId
            ),
            {

                users:[
                    user.uid,
                    request.fromUid
                ],

                userEmails:[
                    user.email,
                    request.fromEmail
                ],

                createdAt:
                    serverTimestamp()

            }
        );


        alert(
            "Friend request accepted!"
        );


        loadRequests();

        loadFriends();

        loadHomeStats();

    }
    catch(error){

        console.error(
            "ACCEPT ERROR:",
            error
        );


        alert(
            "Error: " +
            error.message
        );

    }

}

            "friendsList"
        );

            query(

                where(

            );

            await getDocs(

            );

                        </div>

        container.innerHTML =

            </div>
            `;

}
